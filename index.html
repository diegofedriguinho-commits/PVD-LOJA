<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp, getDocs, setDoc, writeBatch, query, limit, orderBy } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const firebaseConfig = {apiKey: "AIzaSyBaR2gOjcWkQ625WuVPFFcZndrsKk3MqGY",authDomain: "web-pdv-6546d.firebaseapp.com",projectId: "web-pdv-6546d"};
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
const $=id=>document.getElementById(id);
let produtos=[], clientes=[], fornecedores=[], vendas=[], receber=[], pagar=[], movCaixa=[], loja={nome:'D2 MINIMERCADO',end:'RUA MANOEL ABRANTES FILHO 210 JD BELA VISTA',tel:'44997550818'}, carrinho=[], subtotal=0, total=0, saldoCaixa=0, ultimoNumVenda=0;
const SENHA_ZERAR = "LOLA2025";

window.mostrarAba=id=>{document.querySelectorAll('.aba').forEach(a=>a.classList.remove('ativa'));$(id).classList.add('ativa');document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('on'));$(`btn-${id}`).classList.add('on');}
window.entrar=()=>signInWithEmailAndPassword(auth,$('email').value,$('senha').value).catch(e=>alert("Erro login"))
window.sair=()=>signOut(auth);

onAuthStateChanged(auth,u=>{
  if(u){$('login').classList.add('hidden');$('app').classList.remove('hidden'); carregarTudo();}
  else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}
});

function carregarTudo(){
  onSnapshot(collection(db,"produtos"),snap=>{produtos=snap.docs.map(d=>({id:d.id,...d.data()})); buscarProd(); listarProdutos(); carregarFornecedoresSelect();});
  onSnapshot(collection(db,"clientes"),snap=>{clientes=snap.docs.map(d=>({id:d.id,...d.data()})); listarClientes(); carregarClientesSelect();});
  onSnapshot(collection(db,"fornecedores"),snap=>{fornecedores=snap.docs.map(d=>({id:d.id,...d.data()})); listarFornecedores(); carregarFornecedoresSelect();});
  onSnapshot(query(collection(db,"vendas"), orderBy("numVenda","desc"), limit(1)),snap=>{if(!snap.empty){ultimoNumVenda=snap.docs[0].data().numVenda||0}});
  onSnapshot(collection(db,"vendas"),snap=>{vendas=snap.docs.map(d=>({id:d.id,...d.data()}));});
  onSnapshot(collection(db,"receber"),snap=>{receber=snap.docs.map(d=>({id:d.id,...d.data()})); listarReceber();});
  onSnapshot(collection(db,"pagar"),snap=>{pagar=snap.docs.map(d=>({id:d.id,...d.data()})); listarPagar();});
  onSnapshot(collection(db,"loja"),snap=>{if(!snap.empty){loja=snap.docs[0].data(); $('lId').value=snap.docs[0].id; $('lNome').value=loja.nome; $('lEnd').value=loja.end; $('lTel').value=loja.tel; $('nomeLojaHeader').innerText=loja.nome}});
  onSnapshot(collection(db,"caixa"),snap=>{
    movCaixa=snap.docs.map(d=>({id:d.id,...d.data()}));
    saldoCaixa=movCaixa.reduce((a,d)=>a+d.valor,0); $('saldoCaixa').innerText=saldoCaixa.toFixed(2);
    const hoje=new Date(); const inicioMes=new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    const movMes=movCaixa.filter(m=>m.data?.seconds && new Date(m.data.seconds*1000) >= inicioMes);
    const entradasMes=movMes.filter(m=>m.valor>0).reduce((a,b)=>a+b.valor,0);
    const saidasMes=movMes.filter(m=>m.valor<0).reduce((a,b)=>a+b.valor,0);
    $('entradasMes').innerText=entradasMes.toFixed(2);
    $('saidasMes').innerText=Math.abs(saidasMes).toFixed(2);
    $('saldoMes').innerText=(entradasMes+saidasMes).toFixed(2);
  });
}

// LOJA
window.salvarLoja=async()=>{let data={nome:$('lNome').value,end:$('lEnd').value,tel:$('lTel').value}; if($('lId').value){await setDoc(doc(db,"loja",$('lId').value),data)}else{await addDoc(collection(db,"loja"),data)} alert("Dados salvos!")}

// PRODUTOS, CLIENTES, FORNECEDORES CRUD
window.buscarProd=()=>{$('listaProd').innerHTML=produtos.map(p=>`<div onclick="addCarrinho('${p.id}')" class="p-2 border-b cursor-pointer">${p.nome} - R$${p.preco.toFixed(2)} [${p.estoque}]</div>`).join('')}
window.listarProdutos=()=>{$('listaProdutos').innerHTML=produtos.map(p=>`<div class="card"><b>${p.nome}</b><br>Cod:${p.cod} | R$${p.preco} | Est:${p.estoque} | Forn:${p.fornecedorNome||''}<div class="mt-2"><button onclick="editarProduto('${p.id}')" class="btn bg-yellow-500 text-white text-sm">EDITAR</button> <button onclick="excluirProduto('${p.id}')" class="btn bg-red-500 text-white text-sm">EXCLUIR</button></div></div>`).join('')}
window.salvarProduto=async()=>{let forn=fornecedores.find(f=>f.id==$('pFornecedor').value); let data={nome:$('pNome').value,cod:$('pCod').value,custo:parseFloat($('pCusto').value)||0,preco:parseFloat($('pPreco').value)||0,estoque:parseInt($('pEstoque').value)||0,fornecedorId:$('pFornecedor').value,fornecedorNome:forn?.nomeFantasia||''}; if($('pId').value){await updateDoc(doc(db,"produtos",$('pId').value),data)}else{await addDoc(collection(db,"produtos"),data)} limparProd();}
window.editarProduto=id=>{let p=produtos.find(x=>x.id==id);$('pId').value=p.id;$('pNome').value=p.nome;$('pCod').value=p.cod;$('pCusto').value=p.custo;$('pPreco').value=p.preco;$('pEstoque').value=p.estoque;$('pFornecedor').value=p.fornecedorId}
window.excluirProduto=async id=>{if(confirm("Excluir?"))await deleteDoc(doc(db,"produtos",id))}
function limparProd(){$('pId').value='';$('pNome').value='';$('pCod').value='';$('pCusto').value='';$('pPreco').value='';$('pEstoque').value='';$('pFornecedor').value=''}

window.listarClientes=()=>{$('listaClientes').innerHTML=clientes.map(c=>`<div class="card"><b>${c.nome}</b><br>${c.tel}<br>${c.end}<div class="mt-2"><button onclick="editarCliente('${c.id}')" class="btn bg-yellow-500 text-white text-sm">EDITAR</button> <button onclick="excluirCliente('${c.id}')" class="btn bg-red-500 text-white text-sm">EXCLUIR</button></div></div>`).join('')}
window.salvarCliente=async()=>{let data={nome:$('cNome').value,tel:$('cTel').value,cpf:$('cCpf').value,email:$('cEmail').value,end:$('cEnd').value}; if($('cId').value){await updateDoc(doc(db,"clientes",$('cId').value),data)}else{await addDoc(collection(db,"clientes"),data)} limparCliente();}
window.editarCliente=id=>{let c=clientes.find(x=>x.id==id);$('cId').value=c.id;$('cNome').value=c.nome;$('cTel').value=c.tel;$('cCpf').value=c.cpf;$('cEmail').value=c.email;$('cEnd').value=c.end}
window.excluirCliente=async id=>{if(confirm("Excluir?"))await deleteDoc(doc(db,"clientes",id))}
function limparCliente(){$('cId').value='';$('cNome').value='';$('cTel').value='';$('cCpf').value='';$('cEmail').value='';$('cEnd').value='';}
function carregarClientesSelect(){$('clienteVenda').innerHTML='<option value="">Cliente Avulso</option>'+clientes.map(c=>`<option value="${c.id}">${c.nome}</option>`).join('')}

window.listarFornecedores=()=>{$('listaFornecedores').innerHTML=fornecedores.map(f=>`<div class="card"><b>${f.nomeFantasia}</b><br>${f.razao}<br>CNPJ:${f.cnpj}<br>${f.tel}<div class="mt-2"><button onclick="editarFornecedor('${f.id}')" class="btn bg-yellow-500 text-white text-sm">EDITAR</button> <button onclick="excluirFornecedor('${f.id}')" class="btn bg-red-500 text-white text-sm">EXCLUIR</button></div></div>`).join('')}
window.salvarFornecedor=async()=>{let data={razao:$('fNome').value,nomeFantasia:$('fFantasia').value,cnpj:$('fCnpj').value,tel:$('fTel').value,email:$('fEmail').value,end:$('fEnd').value}; if($('fId').value){await updateDoc(doc(db,"fornecedores",$('fId').value),data)}else{await addDoc(collection(db,"fornecedores"),data)} limparFornecedor();}
window.editarFornecedor=id=>{let f=fornecedores.find(x=>x.id==id);$('fId').value=f.id;$('fNome').value=f.razao;$('fFantasia').value=f.nomeFantasia;$('fCnpj').value=f.cnpj;$('fTel').value=f.tel;$('fEmail').value=f.email;$('fEnd').value=f.end}
window.excluirFornecedor=async id=>{if(confirm("Excluir?"))await deleteDoc(doc(db,"fornecedores",id))}
function limparFornecedor(){$('fId').value='';$('fNome').value='';$('fFantasia').value='';$('fCnpj').value='';$('fTel').value='';$('fEmail').value='';$('fEnd').value='';}
function carregarFornecedoresSelect(){let opt='<option value="">Fornecedor</option>'+fornecedores.map(f=>`<option value="${f.id}">${f.nomeFantasia}</option>`).join('');$('pFornecedor').innerHTML=opt; $('pgFornecedor').innerHTML=opt}

// CARRINHO + DESCONTO + TROCO
window.addCarrinho=async id=>{
  let p=produtos.find(x=>x.id==id);if(!p||p.estoque<=0)return alert("Sem estoque");
  let item=carrinho.find(i=>i.id==id);
  if(item){item.qtd++; item.total=item.qtd*p.preco}else{carrinho.push({id:p.id,nome:p.nome,preco:p.preco,qtd:1,total:p.preco})}
  atualizarCarrinho();
}
window.remCarrinho=async id=>{
  let item=carrinho.find(i=>i.id==id);
  if(item.qtd>1){item.qtd--; item.total=item.qtd*item.preco}else{carrinho=carrinho.filter(i=>i.id!=id)}
  atualizarCarrinho();
}
window.atualizarCarrinho=()=>{
  $('carrinho').innerHTML=carrinho.map(i=>`<div class="flex justify-between border-b py-1"><div>${i.nome}</div><div><button onclick="remCarrinho('${i.id}')" class="bg-red-500 text-white px-2 rounded">-</button> ${i.qtd} <button onclick="addCarrinho('${i.id}')" class="bg-green-500 text-white px-2 rounded">+</button></div><div>R$${i.total.toFixed(2)}</div></div>`).join('');
  subtotal=carrinho.reduce((a,i)=>a+i.total,0);$('subtotal').innerText=subtotal.toFixed(2); calcularTotal();
}
window.calcularTotal=()=>{let desc=parseFloat($('desconto').value)||0; total=subtotal-desc; $('total').innerText=total.toFixed(2); calcularTroco();}
window.mostrarTroco=()=>{$('divTroco').style.display = $('formaPag').value=='Dinheiro'? 'block' : 'none'}
window.calcularTroco=()=>{let recebido=parseFloat($('valorRecebido').value)||0; $('troco').innerText=(recebido-total).toFixed(2);}

// VENDAS COM NUMERO SEQUENCIAL
window.finalizarVenda=async()=>{
  if(carrinho.length==0)return alert("Carrinho vazio");
  let forma=$('formaPag').value; let clienteId=$('clienteVenda').value; let cliente=clientes.find(c=>c.id==clienteId); let desconto=parseFloat($('desconto').value)||0; let troco=parseFloat($('troco').innerText)||0;
  let numVenda = ultimoNumVenda + 1;
  let vendaRef=await addDoc(collection(db,"vendas"),{numVenda, itens:carrinho,subtotal,desconto,total,forma,clienteId,clienteNome:cliente?.nome||'Avulso',troco,data:serverTimestamp()});
  for(let i of carrinho){let p=produtos.find(x=>x.id==i.id);await updateDoc(doc(db,"produtos",i.id),{estoque:p.estoque-i.qtd})}
  if(forma!='Prazo'){await addDoc(collection(db,"caixa"),{tipo:'entrada',valor:total,desc:`Venda ${forma}`,data:serverTimestamp()});}
  else if(clienteId){await addDoc(collection(db,"receber"),{clienteId,cliente:cliente.nome,valorTotal:total,valorPago:0,saldo:total,vendaId:vendaRef.id,numVenda,data:serverTimestamp()})}
  imprimirCupom(carrinho,subtotal,desconto,total,forma,troco,cliente?.nome||'Avulso',numVenda);
  carrinho=[];subtotal=0;total=0;$('desconto').value=0;$('valorRecebido').value=0;atualizarCarrinho();
}

// RELATORIOS COM 2ª VIA
window.relVendasDia=()=>{const hoje=new Date().toLocaleDateString(); const vendasHoje=vendas.filter(v=>v.data?.seconds && new Date(v.data.seconds*1000).toLocaleDateString()==hoje);
$('resultadoRel').innerHTML=vendasHoje.map(v=>`<div class="card"><b>VENDA ${String(v.numVenda).padStart(5,'0')}</b> - R$${v.total.toFixed(2)} - ${v.clienteNome}<br><button onclick='imprimirCupom(${JSON.stringify(v.itens)},"${v.subtotal}","${v.desconto}","${v.total}","${v.forma}","${v.troco}","${v.clienteNome}","${v.numVenda}")' class="btn bg-blue-500 text-white text-sm mt-1">IMPRIMIR 2ª VIA</button></div>`).join('') || '<p>Nenhuma venda hoje</p>'}
window.relVendas=()=>{$('resultadoRel').innerHTML=`<div class="card">Dinheiro: R$${vendas.filter(v=>v.forma=='Dinheiro').reduce((a,b)=>a+b.total,0).toFixed(2)}</div><div class="card">Cartão: R$${vendas.filter(v=>v.forma=='Cartão').reduce((a,b)=>a+b.total,0).toFixed(2)}</div><div class="card">Pix: R$${vendas.filter(v=>v.forma=='Pix').reduce((a,b)=>a+b.total,0).toFixed(2)}</div><div class="card">Prazo: R$${vendas.filter(v=>v.forma=='Prazo').reduce((a,b)=>a+b.total,0).toFixed(2)}</div>`}

// CONTAS A RECEBER E PAGAR
window.listarReceber=()=>{$('listaReceber').innerHTML=receber.map(r=>`<div class="card border-yellow-500"><b>${r.cliente}</b><br>Saldo: R$${r.saldo.toFixed(2)}<div class="mt-2"><input id="rec${r.id}" type="number" class="input" placeholder="Valor"><button onclick="receberParcial('${r.id}')" class="btn bg-green-600 text-white mt-1">RECEBER</button></div></div>`).join('')}
window.receberParcial=async(id)=>{let r=receber.find(x=>x.id==id); let valor=parseFloat($(`rec${r.id}`).value); await updateDoc(doc(db,"receber",id),{valorPago:r.valorPago+valor,saldo:r.saldo-valor}); await addDoc(collection(db,"caixa"),{tipo:'entrada',valor:valor,desc:`Receb ${r.cliente}`,data:serverTimestamp()});}
window.salvarContaPagar=async()=>{let forn=fornecedores.find(f=>f.id==$('pgFornecedor').value); let valor=parseFloat($('pgValor').value); let parcelas=parseInt($('pgParcelas').value); for(let i=1;i<=parcelas;i++){await addDoc(collection(db,"pagar"),{desc:`${$('pgDesc').value} - ${i}/${parcelas}`,valor:valor/parcelas,pago:false,fornecedorId:$('pgFornecedor').value,fornecedorNome:forn?.nomeFantasia||'',data:serverTimestamp()})} alert("Conta cadastrada")}
window.listarPagar=()=>{$('listaPagar').innerHTML=pagar.map(p=>`<div class="card ${p.pago?'border-green-500':'border-red-500'}"><b>${p.desc}</b><br>Forn:${p.fornecedorNome||''}<br>R$${p.valor.toFixed(2)} ${!p.pago?`<button onclick="pagarParcela('${p.id}')" class="btn bg-red-600 text-white mt-1">PAGAR</button>`:''}</div>`).join('')}
window.pagarParcela=async(id)=>{let p=pagar.find(x=>x.id==id); await updateDoc(doc(db,"pagar",id),{pago:true}); await addDoc(collection(db,"caixa"),{tipo:'saida',valor:-p.valor,desc:`Pagto ${p.desc}`,data:serverTimestamp()});}

// CAIXA
window.entradaCaixa=async()=>{await addDoc(collection(db,"caixa"),{tipo:'entrada',valor:parseFloat($('mValor').value),desc:$('mDesc').value,data:serverTimestamp()})}
window.saidaCaixa=async()=>{await addDoc(collection(db,"caixa"),{tipo:'saida',valor:-parseFloat($('mValor').value),desc:$('mDesc').value,data:serverTimestamp()})}
window.fecharCaixa=()=>{imprimirFechamento(); addDoc(collection(db,"caixa"),{tipo:'fechamento',valor:-saldoCaixa,desc:'Fechamento',data:serverTimestamp()})}

// IMPRESSÃO CORRIGIDA
window.imprimirCupom=(itens,subtotal,desconto,total,forma,troco,clienteNome,numVenda)=>{
  let html=`<div style="width:300px;font-family:monospace;text-align:center">
  <h2>${loja.nome}</h2><p>${loja.end}</p><p>Tel: ${loja.tel}</p><hr>
  <p style="text-align:left">VENDA: ${String(numVenda).padStart(5,'0')}</p>
  <p style="text-align:left">CLIENTE: ${clienteNome}</p><p style="text-align:left">PAGTO: ${forma}</p><hr>`;
  itens.forEach(i=>html+=`<div style="text-align:left">${i.nome} ${i.qtd}x R$${i.preco.toFixed(2)}</div>`);
  html+=`<hr><div style="text-align:left">Subtotal: R$${parseFloat(subtotal).toFixed(2)}</div>`;
  if(parseFloat(desconto)>0)html+=`<div style="text-align:left">Desconto: -R$${parseFloat(desconto).toFixed(2)}</div>`;
  html+=`<h3>TOTAL: R$${parseFloat(total).toFixed(2)}</h3>`;
  if(forma=='Dinheiro' && parseFloat(troco)>0)html+=`<div>Recebido: R$${(parseFloat(total)+parseFloat(troco)).toFixed(2)}</div><div>Troco: R$${parseFloat(troco).toFixed(2)}</div>`;
  html+=`<p>Obrigado e Volte Sempre!</p></div>`;
  let w=window.open('','_blank');w.document.write(html);w.document.close();w.print();
}
window.imprimirFechamento=()=>{
  let entradas=movCaixa.filter(m=>m.valor>0).reduce((a,b)=>a+b.valor,0);
  let saidas=movCaixa.filter(m=>m.valor<0).reduce((a,b)=>a+b.valor,0);
  let html=`<div style="width:300px;font-family:monospace;text-align:center"><h2>${loja.nome} - FECHAMENTO</h2><p>Entradas: R$${entradas.toFixed(2)}</p><p>Saídas: R$${Math.abs(saidas).toFixed(2)}</p><hr><h3>SALDO: R$${saldoCaixa.toFixed(2)}</h3></div>`;
  let w=window.open('','_blank');w.document.write(html);w.document.close();w.print();
}

// ZERAR SISTEMA
async function deletarColecao(nomeColecao) {
  const q = query(collection(db, nomeColecao), limit(400));
  const snap = await getDocs(q);
  if (snap.empty) return 0;
  const batch = writeBatch(db);
  snap.docs.forEach(d => batch.delete(d.ref));
  await batch.commit();
  return snap.size;
}

window.zerarSistema=async()=>{
  let senha=prompt("ATENÇÃO! Isso apaga TUDO. Digite a senha:");
  if(senha!=SENHA_ZERAR)return alert("Senha incorreta");
  if(!confirm("Tem certeza? Isso não tem volta!"))return;
  $('statusZerar').innerText = "Apagando... Aguarde";
  const colecoes=['produtos','clientes','vendas','receber','pagar','caixa','fornecedores','loja'];
  for(const col of colecoes){
    let totalApagado = 0; let apagados;
    do {
      apagados = await deletarColecao(col);
      totalApagado += apagados;
      $('statusZerar').innerText = `Apagando ${col}... ${totalApagado} docs`;
    } while (apagados > 0);
  }
  $('statusZerar').innerText = "Sistema zerado! Recarregando...";
  setTimeout(()=>location.reload(), 2000);
}
</script>
