<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV Iguaraçu</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#f1f5f9;font-family:Arial}
.btn{padding:12px;border-radius:8px;font-weight:bold}
.aba{display:none}
.ativa{display:block}
.menu button{flex:1;padding:10px;font-size:12px}
.menu .on{background:#2563eb;color:white}
</style>
</head>
<body>

<div id="login" class="h-screen flex items-center justify-center">
  <div class="bg-white p-6 rounded shadow w-80">
    <h1 class="text-center text-2xl font-bold mb-4">PDV LOGIN</h1>
    <input id="email" class="w-full border p-2 mb-2 rounded" placeholder="Email">
    <input id="senha" type="password" class="w-full border p-2 mb-2 rounded" placeholder="Senha">
    <button onclick="entrar()" class="w-full btn bg-blue-600 text-white">ENTRAR</button>
    <button onclick="cadastrar()" class="w-full btn bg-gray-500 text-white mt-2">CADASTRAR</button>
    <p id="erro" class="text-red-500 text-center mt-2"></p>
  </div>
</div>

<div id="app" class="hidden">
<header class="bg-blue-600 text-white p-3 flex justify-between">
  <b>PDV IGUARAÇU</b>
  <button onclick="sair()" class="bg-red-500 px-3 rounded">SAIR</button>
</header>

<div class="p-3">
  <!-- CLIENTES -->
  <div id="clientes" class="aba">
    <div class="bg-white p-3 rounded mb-3">
      <h2 class="font-bold mb-2">Novo Cliente</h2>
      <input id="nomeCli" placeholder="Nome" class="w-full border p-2 mb-2 rounded">
      <button onclick="salvarCliente()" class="w-full btn bg-green-600 text-white">SALVAR CLIENTE</button>
    </div>
    <div id="listaCli" class="bg-white p-3 rounded"></div>
  </div>

  <!-- FORNECEDORES -->
  <div id="fornecedores" class="aba">
    <div class="bg-white p-3 rounded mb-3">
      <h2 class="font-bold mb-2">Novo Fornecedor</h2>
      <input id="nomeFor" placeholder="Nome" class="w-full border p-2 mb-2 rounded">
      <button onclick="salvarFornecedor()" class="w-full btn bg-green-600 text-white">SALVAR FORNECEDOR</button>
    </div>
    <div id="listaFor" class="bg-white p-3 rounded"></div>
  </div>

  <!-- LOJA -->
  <div id="loja" class="aba">
    <div class="bg-white p-3 rounded">
      <h2 class="font-bold mb-2">Dados da Loja</h2>
      <input id="nomeLoja" placeholder="Nome da Loja" class="w-full border p-2 mb-2 rounded">
      <button onclick="salvarLoja()" class="w-full btn bg-blue-600 text-white">SALVAR LOJA</button>
    </div>
  </div>

  <!-- CONTAS A PAGAR -->
  <div id="pagar" class="aba">
    <div class="bg-white p-3 rounded mb-3">
      <h2 class="font-bold mb-2">Nova Conta a Pagar</h2>
      <input id="descPagar" placeholder="Descrição" class="w-full border p-2 mb-2 rounded">
      <input id="valorPagar" type="number" placeholder="Valor" class="w-full border p-2 mb-2 rounded">
      <select id="forPagar" class="w-full border p-2 mb-2 rounded"></select>
      <button onclick="salvarContaPagar()" class="w-full btn bg-red-600 text-white">LANÇAR CONTA</button>
    </div>
    <div id="listaPagar" class="bg-white p-3 rounded"></div>
  </div>
</div>

<!-- MENU INFERIOR -->
<div class="menu fixed bottom-0 left-0 right-0 bg-white flex border-t">
  <button onclick="mostrarAba('clientes')" id="btn-clientes" class="on">CLIENTES</button>
  <button onclick="mostrarAba('fornecedores')" id="btn-fornecedores">FORNEC</button>
  <button onclick="mostrarAba('loja')" id="btn-loja">LOJA</button>
  <button onclick="mostrarAba('pagar')" id="btn-pagar">PAGAR</button>
</div>

</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const firebaseConfig = {apiKey: "AIzaSyBaR2gOjcWkQ625WuVPFFcZndrsKk3MqGY",authDomain: "web-pdv-6546d.firebaseapp.com",projectId: "web-pdv-6546d"};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let clientes = [], fornecedores = [];

window.entrar = () => {
  signInWithEmailAndPassword(auth, email.value, senha.value)
  .catch(e => erro.innerText = e.message)
}
window.cadastrar = () => {
  createUserWithEmailAndPassword(auth, email.value, senha.value)
  .catch(e => erro.innerText = e.message)
}
window.sair = () => signOut(auth);

onAuthStateChanged(auth, user => {
  if(user){
    login.classList.add('hidden');
    app.classList.remove('hidden');
    carregarTudo();
    mostrarAba('clientes');
  }else{
    login.classList.remove('hidden');
    app.classList.add('hidden');
  }
});

function mostrarAba(aba){
  document.querySelectorAll('.aba').forEach(a=>a.classList.remove('ativa'));
  document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('on'));
  document.getElementById(aba).classList.add('ativa');
  document.getElementById('btn-'+aba).classList.add('on');
}

async function carregarTudo(){
  clientes = (await getDocs(collection(db,"clientes"))).docs.map(d=>({id:d.id,...d.data()}));
  fornecedores = (await getDocs(collection(db,"fornecedores"))).docs.map(d=>({id:d.id,...d.data()}));
  const loja = await getDoc(doc(db,"loja","dados"));
  if(loja.exists()) nomeLoja.value = loja.data().nome;
  
  listaCli.innerHTML = clientes.map(c=>`<div class="border-b py-2">${c.nome}</div>`).join('') || "Nenhum cliente";
  listaFor.innerHTML = fornecedores.map(f=>`<div class="border-b py-2">${f.nome}</div>`).join('') || "Nenhum fornecedor";
  forPagar.innerHTML = '<option>Selecione</option>' + fornecedores.map(f=>`<option value="${f.id}">${f.nome}</option>`).join('');
  
  const contas = await getDocs(collection(db,"contasPagar"));
  listaPagar.innerHTML = contas.docs.map(d=>`<div class="border-b py-2">${d.data().desc} - R$${d.data().valor}</div>`).join('') || "Nenhuma conta";
}

window.salvarCliente = async () => {
  if(!nomeCli.value) return alert("Digite o nome");
  await addDoc(collection(db,"clientes"),{nome:nomeCli.value});
  nomeCli.value=""; alert("Cliente salvo!"); carregarTudo();
}

window.salvarFornecedor = async () => {
  if(!nomeFor.value) return alert("Digite o nome");
  await addDoc(collection(db,"fornecedores"),{nome:nomeFor.value});
  nomeFor.value=""; alert("Fornecedor salvo!"); carregarTudo();
}

window.salvarLoja = async () => {
  await setDoc(doc(db,"loja","dados"),{nome:nomeLoja.value});
  alert("Loja salva!");
}

window.salvarContaPagar = async () => {
  if(!descPagar.value || !valorPagar.value || forPagar.value=="Selecione") return alert("Preencha tudo");
  await addDoc(collection(db,"contasPagar"),{
    desc: descPagar.value,
    valor: Number(valorPagar.value),
    for: forPagar.value,
    status: "Pendente"
  });
  descPagar.value=""; valorPagar.value=""; alert("Conta lançada!"); carregarTudo();
}
</script>
</body>
</html>
