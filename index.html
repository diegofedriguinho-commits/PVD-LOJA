<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDV Simples</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; }
    input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
    button { background: #2563eb; color: white; border: none; cursor: pointer; }
    button:hover { background: #1d4ed8; }
    .menu button { width: auto; margin-right: 10px; background: #555; }
    .menu button:hover { background: #333; }
    #app, #produtos { display: none; }
    .tela { display: none; }
    .tela.ativa { display: block; }
  </style>

  <!-- FIREBASE SDK v9 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // ⚠️ SUA CONFIG JÁ ESTÁ AQUI ⚠️
   const firebaseConfig = {
    apiKey: "AIzaSyBaR2gOjcWkQ625WuVPFFcZndrsKk3MqGY",
    authDomain: "web-pdv-6546d.firebaseapp.com",
    projectId: "web-pdv-6546d",
    storageBucket: "web-pdv-6546d.firebasestorage.app",
    messagingSenderId: "985739667688",
    appId: "1:985739667688:web:a1518c0379e7848b97815d"
  };

    const app = initializeApp(firebaseConfig);
    window.auth = getAuth(app);
    window.db = getFirestore(app);
  </script>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div class="container" id="login">
    <h2>Login PDV</h2>
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="senha" placeholder="Senha">
    <button onclick="fazerLogin()">Entrar</button>
    <p style="text-align:center; margin-top:10px;">
      Não tem conta? <a href="#" onclick="fazerCadastro()">Cadastre-se aqui</a>
    </p>
  </div>

  <!-- TELA DO APP COM MENU -->
  <div class="container" id="app">
    <div class="menu">
      <button onclick="mostrarTela('vendas')">Vendas</button>
      <button onclick="mostrarTela('produtos')">Produtos</button>
      <button onclick="logout()">Sair</button>
    </div>

    <!-- TELA VENDAS -->
    <div id="tela-vendas" class="tela ativa">
      <h2>Nova Venda</h2>
      <input type="text" id="produto" placeholder="Nome do Produto">
      <input type="number" id="valor" placeholder="Valor R$">
      <button onclick="salvarVenda()">Salvar Venda</button>
      <p id="msg"></p>
    </div>

    <!-- TELA PRODUTOS -->
    <div id="tela-produtos" class="tela">
      <h2>Cadastrar Produto</h2>
      <input type="text" id="nomeProd" placeholder="Nome do Produto">
      <input type="number" id="precoProd" placeholder="Preço R$">
      <input type="number" id="estoqueProd" placeholder="Estoque">
      <button onclick="salvarProduto()">Salvar Produto</button>
      <p id="msgProd"></p>
    </div>
  </div>

  <script type="module">
    import { signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
    import { addDoc, collection } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

    // LOGIN
    window.fazerLogin = async () => {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      try {
        await signInWithEmailAndPassword(window.auth, email, senha);
        document.getElementById('login').style.display = 'none';
        document.getElementById('app').style.display = 'block';
      } catch(e) {
        alert("Erro: " + e.message)
      }
    }

    // CADASTRO
    window.fazerCadastro = async () => {
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      if(!email || !senha) return alert("Preencha email e senha primeiro");
      try {
        await createUserWithEmailAndPassword(window.auth, email, senha);
        alert("Usuário criado! Agora clique em Entrar.");
      } catch(e) {
        alert("Erro: " + e.message)
      }
    }

    // MENU
    window.mostrarTela = (tela) => {
      document.querySelectorAll('.tela').forEach(t => t.classList.remove('ativa'));
      document.getElementById('tela-' + tela).classList.add('ativa');
    }

    // SAIR
    window.logout = () => {
      window.auth.signOut();
      document.getElementById('login').style.display = 'block';
      document.getElementById('app').style.display = 'none';
    }

    // SALVAR VENDA
    window.salvarVenda = async () => {
      const produto = document.getElementById('produto').value;
      const valor = parseFloat(document.getElementById('valor').value);
      try {
        await addDoc(collection(window.db, "vendas"), {
          produto, valor, data: new Date()
        });
        document.getElementById('msg').innerText = "Venda salva com sucesso!";
        document.getElementById('produto').value = "";
        document.getElementById('valor').value = "";
      } catch(e) {
        alert("Erro: " + e.message)
      }
    }

    // SALVAR PRODUTO
    window.salvarProduto = async () => {
      const nome = document.getElementById('nomeProd').value;
      const preco = parseFloat(document.getElementById('precoProd').value);
      const estoque = parseInt(document.getElementById('estoqueProd').value);
      try {
        await addDoc(collection(window.db, "produtos"), {
          nome, preco, estoque
        });
        document.getElementById('msgProd').innerText = "Produto salvo com sucesso!";
        document.getElementById('nomeProd').value = "";
        document.getElementById('precoProd').value = "";
        document.getElementById('estoqueProd').value = "";
      } catch(e) {
        alert("Erro: " + e.message)
      }
    }
  </script>
</body>
</html>
