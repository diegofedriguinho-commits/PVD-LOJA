<script>
const firebaseConfig = {apiKey: "AIzaSyBaR2gOjcWkQ625WuVPFFcZndrsKk3MqGY",authDomain: "web-pdv-6546d.firebaseapp.com",projectId: "web-pdv-6546d"};
firebase.initializeApp(firebaseConfig); const db = firebase.firestore(); const $=id=>document.getElementById(id);

let produtos=[], clientes=[], fornecedores=[], vendas=[], receber=[], pagar=[], movCaixa=[], loja={}, carrinho=[], subtotal=0, total=0, saldoCaixa=0, ultimoNumVenda=0, itensNF=[], graficoFluxo, caixaAberto=false;
let usuarioLogado=null; const SENHA_ZERAR = "LOLA2025";
let permissoes = {caixa: {senha: '1234', podeEstornar: false, podeFecharCaixa: false}, gerente: {senha: '9999', podeEstornar: true, podeFecharCaixa: true}}
let leitorAtivo = false;
let ultimoCodigoLido = "";
let travado = false; // NOVA TRAVA ANTI DUPLICIDADE

function toNum(v){ return parseFloat(String(v).replace(',','.')) || 0; }
function alternarTema(){document.body.classList.toggle('dark')}
function alternarTelaCheia(){document.body.classList.toggle('pdv-cheio')}
function mostrarAba(id){document.querySelectorAll('.aba').forEach(a=>a.classList.remove('ativa'));$(id).classList.add('ativa');document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('on'));$(`btn-${id}`).classList.add('on'); if(id=='financeiro') carregarFinanceiro();}
function logar(){let user = $('usuarioLogin').value; let senha = $('senhaLogin').value; if(permissoes[user] && permissoes[user].senha == senha){usuarioLogado = user; $('userLogado').innerText=user.toUpperCase(); $('telaLogin').classList.add('hidden'); verificarPermissoes(); carregarTudo(); $('buscaProd').focus();} else {$('erroLogin').innerText = 'Usuário ou Senha inválidos!';}}
function sair(){location.reload();}
function verificarPermissoes(){if($('btnIniciarFech')){$('btnIniciarFech').disabled =!permissoes[usuarioLogado].podeFecharCaixa;}}

function carregarTudo(){
  function verificarEstoqueBaixo(){let baixos = produtos.filter(p => (p.estoque||0) > 0 && (p.estoque||0) <= 5); if(baixos.length > 0){$('alertaEstoque').classList.remove('hidden'); $('listaAlertaEstoque').innerHTML = baixos.map(p=>`<p>${p.nome}: <b>${p.estoque}</b> un</p>`).join('');} else {$('alertaEstoque').classList.add('hidden');}}
  function verificarContasVencidas(){let hoje=new Date(); let vencidas=pagar.filter(p=>!p.pago && p.vencimento?.seconds && new Date(p.vencimento.seconds*1000)<hoje); if(vencidas.length>0){$('alertaContas').classList.remove('hidden'); $('listaAlertaContas').innerHTML=vencidas.map(p=>`<p>${p.desc}: R$${Number(p.valor).toFixed(2)}</p>`).join('')}else{$('alertaContas').classList.add('hidden')}}

  db.collection("produtos").onSnapshot(snap=>{produtos=snap.docs.map(d=>({id:d.id,...d.data()})); buscarProd(); listarProdutos(); verificarEstoqueBaixo();});
  db.collection("clientes").onSnapshot(snap=>{clientes=snap.docs.map(d=>({id:d.id,...d.data()})); listarClientes();});
  db.collection("fornecedores").onSnapshot(snap=>{fornecedores=snap.docs.map(d=>({id:d.id,...d.data()})); listarFornecedores(); preencherSelectFornecedor();});
  db.collection("vendas").orderBy("numVenda","desc").limit(1).onSnapshot(snap=>{if(!snap.empty){ultimoNumVenda=snap.docs[0].data().numVenda||0}});
  db.collection("vendas").onSnapshot(snap=>{vendas=snap.docs.map(d=>({id:d.id,...d.data()}));});
  db.collection("receber").onSnapshot(snap=>{receber=snap.docs.map(d=>({id:d.id,...d.data()})); listarReceber();});
  db.collection("pagar").onSnapshot(snap=>{pagar=snap.docs.map(d=>({id:d.id,...d.data()})); listarPagar(); verificarContasVencidas();});
  db.collection("loja").onSnapshot(snap=>{if(!snap.empty){let docLoja = snap.docs[0]; loja=docLoja.data(); $('lId').value=docLoja.id; $('lNome').value=loja.nome||'';}});
  db.collection("caixa").onSnapshot(snap=>{
    movCaixa=snap.docs.map(d=>({id:d.id,...d.data()}));
    saldoCaixa=movCaixa.reduce((a,d)=>a+(d.valor||0),0);
    $('saldoCaixa').innerText=saldoCaixa.toFixed(2);
    carregarExtratoCaixa();
    let hoje=new Date();
    let inicioMes=new Date(hoje.getFullYear(), hoje.getMonth(), 1);
    let entradasMes=movCaixa.filter(m=>m.tipo=='entrada' && m.data?.seconds && new Date(m.data.seconds*1000)>=inicioMes).reduce((a,b)=>a+b.valor,0);
    if($('entradasMes')) $('entradasMes').innerText=entradasMes.toFixed(2);
  });
}

function verificarLimiteCliente(){let clienteId=$('clienteVenda').value; if(!clienteId){$('infoCliente').innerHTML=''; return;} let cliente=clientes.find(c=>c.id==clienteId); let dividas=receber.filter(r=>r.clienteId==clienteId).reduce((a,b)=>a+(b.saldo||0),0); let limite=cliente.limite||0; $('infoCliente').innerHTML=`Limite: R$${limite.toFixed(2)} | Devendo: R$${dividas.toFixed(2)}`;}
function buscarProd(){$('listaProd').innerHTML=produtos.filter(p=>p.nome.toLowerCase().includes($('buscaProd').value.toLowerCase())).map(p=>`<div onclick="addCarrinho('${p.id}')" class="p-2 border-b cursor-pointer">${p.nome} - R$${Number(p.preco||0).toFixed(2)} [${p.estoque||0}]</div>`).join('')}
function listarProdutos(){$('listaProdutos').innerHTML=produtos.map(p=>`<div class="card"><b>${p.nome}</b><br>R$${Number(p.preco||0).toFixed(2)} | Est:${p.estoque||0} | Bloqueia:${p.bloqueiaEstoque?'Sim':'Não'}<div class="mt-2"><button onclick="editarProduto('${p.id}')" class="btn bg-yellow-500 text-white text-sm">EDITAR</button> <button onclick="excluirProduto('${p.id}')" class="btn bg-red-500 text-white text-sm">EXCLUIR</button></div></div>`).join('')}
function salvarProduto(){let data={nome:$('pNome').value,cod:$('pCod').value,custo:toNum($('pCusto').value),preco:toNum($('pPreco').value),estoque:parseInt(toNum($('pEstoque').value))||0,validade:$('pValidade').value,fornecedorId:$('pFornecedor').value,bloqueiaEstoque:$('pBloqueiaEstoque').checked}; if($('pId').value){db.collection("produtos").doc($('pId').value).update(data)}else{db.collection("produtos").add(data)} alert("Salvo!"); $('pId').value='';}
function editarProduto(id){let p=produtos.find(x=>x.id==id);$('pId').value=p.id;$('pNome').value=p.nome;$('pCod').value=p.cod;$('pCusto').value=p.custo;$('pPreco').value=p.preco;$('pEstoque').value=p.estoque;$('pValidade').value=p.validade;$('pFornecedor').value=p.fornecedorId;$('pBloqueiaEstoque').checked=p.bloqueiaEstoque||false}
function excluirProduto(id){if(confirm("Excluir?"))db.collection("produtos").doc(id).delete()}
function listarClientes(){let options = '<option value="">Cliente Avulso</option>'; options += clientes.map(c=>`<option value="${c.id}">${c.nome}</option>`).join(''); $('clienteVenda').innerHTML = options; $('listaClientes').innerHTML=clientes.map(c=>`<div class="card"><b>${c.nome}</b><br>CPF: ${c.cpf||''} | Tel: ${c.tel||''}<br>Limite: R$${Number(c.limite||0).toFixed(2)}<div class="mt-2"><button onclick="editarCliente('${c.id}')" class="btn bg-yellow-500 text-white text-sm">EDITAR</button> <button onclick="excluirCliente('${c.id}')" class="btn bg-red-500 text-white text-sm">EXCLUIR</button></div></div>`).join('')}
function salvarCliente(){let data={nome:$('cNome').value,cpf:$('cCpf').value,tel:$('cTel').value,email:$('cEmail').value,end:$('cEnd').value,limite:toNum($('cLimite').value)}; if($('cId').value){db.collection("clientes").doc($('cId').value).update(data)}else{db.collection("clientes").add(data)} alert("Salvo!"); $('cId').value=''; $('cNome').value=''; $('cCpf').value=''; $('cTel').value=''; $('cEmail').value=''; $('cEnd').value=''; $('cLimite').value='';}
function editarCliente(id){let c=clientes.find(x=>x.id==id); $('cId').value=c.id; $('cNome').value=c.nome; $('cCpf').value=c.cpf; $('cTel').value=c.tel; $('cEmail').value=c.email; $('cEnd').value=c.end; $('cLimite').value=c.limite; }
function excluirCliente(id){if(confirm("Excluir cliente?"))db.collection("clientes").doc(id).delete()}
function listarFornecedores(){$('listaFornecedores').innerHTML=fornecedores.map(f=>`<div class="card"><b>${f.nomeFantasia}</b><br>Razão: ${f.razao}<br>CNPJ: ${f.cnpj||''} | Tel: ${f.tel||''}<div class="mt-2"><button onclick="editarFornecedor('${f.id}')" class="btn bg-yellow-500 text-white text-sm">EDITAR</button> <button onclick="excluirFornecedor('${f.id}')" class="btn bg-red-500 text-white text-sm">EXCLUIR</button></div></div>`).join('')}
function preencherSelectFornecedor(){let options = '<option value="">Fornecedor</option>'; options += fornecedores.map(f=>`<option value="${f.id}">${f.nomeFantasia}</option>`).join(''); $('pFornecedor').innerHTML = options; $('pgFornecedor').innerHTML = options;}
function salvarFornecedor(){let data={razao:$('fRazao').value,nomeFantasia:$('fFantasia').value,cnpj:$('fCnpj').value,tel:$('fTel').value,email:$('fEmail').value,end:$('fEnd').value}; if($('fId').value){db.collection("fornecedores").doc($('fId').value).update(data)}else{db.collection("fornecedores").add(data)} alert("Salvo!"); $('fId').value=''; $('fRazao').value=''; $('fFantasia').value=''; $('fCnpj').value=''; $('fTel').value=''; $('fEmail').value=''; $('fEnd').value='';}
function editarFornecedor(id){let f=fornecedores.find(x=>x.id==id); $('fId').value=f.id; $('fRazao').value=f.razao; $('fFantasia').value=f.nomeFantasia; $('fCnpj').value=f.cnpj; $('fTel').value=f.tel; $('fEmail').value=f.email; $('fEnd').value=f.end; }
function excluirFornecedor(id){if(confirm("Excluir fornecedor?"))db.collection("fornecedores").doc(id).delete()}
function salvarLoja(){let data={nome:$('lNome').value,end:$('lEnd').value,tel:$('lTel').value,cnpj:$('lCnpj').value}; if($('lId').value){db.collection("loja").doc($('lId').value).set(data)}else{db.collection("loja").add(data)} alert("Salvo!")}
function listarReceber(){$('listaReceber').innerHTML=receber.filter(r=>(r.saldo||0)>0).map(r=>`<div class="card"><b>${r.cliente}</b><br>Saldo: R$${Number(r.saldo||0).toFixed(2)}<input id="baixa_${r.id}" type="text" inputmode="decimal" class="input mt-2 mb-2" placeholder="Valor da baixa"><button onclick="darBaixaReceber('${r.id}')" class="btn bg-green-600 text-white w-full">DAR BAIXA</button></div>`).join('') || '<p>Sem contas</p>'}
function darBaixaReceber(id){let valor=toNum($(`baixa_${id}`).value); if(valor<=0) return alert("Digite um valor"); let conta=receber.find(r=>r.id==id); let novoSaldo = (conta.saldo||0) - valor; db.collection("caixa").add({tipo:'entrada',valor:valor,desc:`Receb. ${conta.cliente}`,data:firebase.firestore.FieldValue.serverTimestamp()}); if(novoSaldo<=0){db.collection("receber").doc(id).delete();}else{db.collection("receber").doc(id).update({saldo:novoSaldo});}}
function listarPagar(){$('listaPagar').innerHTML=pagar.filter(p=>!p.pago).map(p=>{let dataVenc = p.vencimento?.seconds? new Date(p.vencimento.seconds*1000).toLocaleDateString('pt-BR') : 'Sem data'; return `<div class="card"><b>${p.desc}</b><br>R$${Number(p.valor||0).toFixed(2)}<br><span class="text-xs">Venc: ${dataVenc}</span><button onclick="pagarParcela('${p.id}')" class="btn bg-red-600 text-white w-full mt-2">PAGAR</button></div>`}).join('') || '<p>Sem contas</p>'}
function pagarParcela(id){let conta=pagar.find(p=>p.id==id); db.collection("pagar").doc(id).update({pago:true}); db.collection("caixa").add({tipo:'saida',valor:-conta.valor,desc:`Pag. ${conta.desc}`,data:firebase.firestore.FieldValue.serverTimestamp()});}
function addCarrinho(id){let p=produtos.find(x=>x.id==id); if(!p) return; if((p.estoque||0)<=0 && p.bloqueiaEstoque){return alert("PRODUTO SEM ESTOQUE E BLOQUEADO PARA VENDA!")} let item=carrinho.find(i=>i.id==id); if(item){item.qtd++; item.total=item.qtd*p.preco}else{carrinho.push({id:p.id,nome:p.nome,preco:p.preco,qtd:1,total:p.preco})}atualizarCarrinho();}
function atualizarCarrinho(){$('carrinho').innerHTML=carrinho.map(i=>`<div class="flex justify-between items-center border-b py-1"><div class="flex-1">${i.nome}</div><div class="flex items-center gap-1"><button onclick="alterarQtd('${i.id}',-1)" class="btn bg-red-500 text-white text-xs px-2">-</button><span>${i.qtd}</span><button onclick="alterarQtd('${i.id}',1)" class="btn bg-green-500 text-white text-xs px-2">+</button></div><div>R$${i.total.toFixed(2)}</div></div>`).join(''); subtotal=carrinho.reduce((a,i)=>a+i.total,0); $('subtotal').innerText=subtotal.toFixed(2); calcularTotal();}
function alterarQtd(id, qtd){let item = carrinho.find(i=>i.id==id); if(!item) return; item.qtd += qtd; if(item.qtd <= 0){carrinho = carrinho.filter(i=>i.id!=id);} else {item.total = item.qtd * item.preco;} atualizarCarrinho();}
function calcularTotal(){let desc=toNum($('desconto').value); total=subtotal-desc; $('total').innerText=total.toFixed(2); calcularTroco();}
function calcularTotalP(){let perc=toNum($('descontoP').value); let valorDesc = subtotal * (perc/100); $('desconto').value = valorDesc.toFixed(2); calcularTotal();}
function mostrarTroco(){if($('formaPag').value=='Dinheiro'){$('divTroco').style.display = 'block'} else {$('divTroco').style.display = 'none'}}
function calcularTroco(){let recebido=toNum($('valorRecebido').value); $('troco').innerText=(recebido-total).toFixed(2);}

function imprimirCupom(venda, reimpressao = false){
  let dataVenda = venda.data?.seconds? new Date(venda.data.seconds*1000) : new Date();
  let dataStr = dataVenda.toLocaleDateString('pt-BR'); let horaStr = dataVenda.toLocaleTimeString('pt-BR');
  let itensHTML = venda.itens.map(i=>`<div style="display:flex;justify-content:space-between"><span>${i.qtd}x ${i.nome.substring(0,18)}</span><span>R$${Number(i.total).toFixed(2)}</span></div><div style="font-size:10px">R$${Number(i.preco).toFixed(2)} un</div>`).join('');
  let rodape = reimpressao? '<p style="text-align:center">*** 2ª VIA ***</p>' : '';
  let descontoTxt = venda.desconto>0? `<p>Desconto: R$${Number(venda.desconto).toFixed(2)}</p>` : '';
  let trocoTxt = venda.forma=='Dinheiro'? `<p>Valor Recebido: R$${(venda.total+venda.troco).toFixed(2)}</p><p>Troco: R$${Number(venda.troco).toFixed(2)}</p>` : '';
  let html=`<div style="width:80mm;font-family:'Courier New',monospace;font-size:12px;color:black;padding:5px"><h2 style="text-align:center">${loja.nome}</h2><p style="text-align:center">${loja.end||''} | ${loja.tel||''}</p><p>----------------------------------------</p><p>VENDA: ${String(venda.numVenda).padStart(5,'0')} ${rodape}</p><p>DATA: ${dataStr} ${horaStr}</p><p>CLIENTE: ${venda.clienteNome}</p><p>FORMA: ${venda.forma}</p><p>VENDEDOR: ${usuarioLogado.toUpperCase()}</p><p>----------------------------------------</p>${itensHTML}<p>----------------------------------------</p><p>Subtotal: R$${Number(venda.subtotal).toFixed(2)}</p>${descontoTxt}<h3>TOTAL: R$${Number(venda.total).toFixed(2)}</h3>${trocoTxt}<p>----------------------------------------</p><p style="text-align:center">OBRIGADO PELA PREFERÊNCIA!</p><p style="text-align:center">D2 SISTEMAS V18.52</p></div>`;
  $('areaImpressao').innerHTML=html; $('areaImpressao').style.display='block'; window.print(); $('areaImpressao').style.display='none';
}

function reimprimirCupom(){let num = prompt("Digite o NÚMERO DA VENDA:"); if(!num) return; let venda = vendas.find(v=> v.numVenda == parseInt(num)); if(!venda) return alert("Venda não encontrada!"); imprimirCupom(venda, true);}

function finalizarVenda(){
  if(carrinho.length==0)return alert("Carrinho vazio");
  let numVenda = ultimoNumVenda + 1;
  let clienteId = $('clienteVenda').value;
  let clienteNome = clienteId? clientes.find(c=>c.id==clienteId).nome : 'Avulso';
  let vendaData={numVenda, itens:carrinho, subtotal, desconto:toNum($('desconto').value), total, forma:$('formaPag').value, clienteId, clienteNome, troco:toNum($('troco').innerText), status:'ativa', vendedor: usuarioLogado, data:firebase.firestore.FieldValue.serverTimestamp()};
  db.collection("vendas").add(vendaData).then(()=>{
    for(let i of carrinho){let p=produtos.find(x=>x.id==i.id); let novoEstoque = (p.estoque||0) - i.qtd; db.collection("produtos").doc(i.id).update({estoque:novoEstoque})}
    if($('formaPag').value=='Prazo'){db.collection("receber").add({clienteId, cliente:clienteNome, total, saldo:total, numVenda, data:firebase.firestore.FieldValue.serverTimestamp()});}
    else {db.collection("caixa").add({tipo:'entrada',valor:total,desc:`Venda ${numVenda}`, forma:$('formaPag').value, data:firebase.firestore.FieldValue.serverTimestamp()});}
    imprimirCupom({...vendaData, data:{seconds:Date.now()/1000}});
    carrinho=[]; subtotal=0; total=0; atualizarCarrinho(); $('clienteVenda').value=''; $('infoCliente').innerHTML=''; alert("Venda finalizada!")
  })
}

function carregarFinanceiro(){
  let hoje=new Date(); let inicioMes=new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  let vendasMes=vendas.filter(v=>v.data?.seconds && new Date(v.data.seconds*1000)>=inicioMes && v.status!='estornada');
  let receita=vendasMes.reduce((a,b)=>a+b.total,0);
  let custo=0; vendasMes.forEach(v=>{v.itens.forEach(i=>{let p=produtos.find(x=>x.id==i.id); custo += (p?.custo||0) * i.qtd})});
  let despesas=movCaixa.filter(m=>m.tipo=='saida' && m.data?.seconds && new Date(m.data.seconds*1000)>=inicioMes).reduce((a,b)=>a+Math.abs(b.valor||0),0);
  let lucro = receita - custo - despesas;
  $('dreReceita').innerText=receita.toFixed(2); $('dreCusto').innerText=custo.toFixed(2); $('dreDespesa').innerText=despesas.toFixed(2); $('dreLucro').innerText=lucro.toFixed(2);
  let meta=toNum($('metaMes').value); let perc = meta>0? (receita/meta)*100 : 0; $('barraMeta').style.width = perc+'%'; $('valorMeta').innerText=receita.toFixed(2);
  const ctx = document.getElementById('graficoFluxo'); if(graficoFluxo) graficoFluxo.destroy();
  graficoFluxo = new Chart(ctx, {type:'bar',data:{labels:['Entradas','Saídas'],datasets:[{data:[receita,despesas],backgroundColor:['#22c55e','#ef4444']}]},options:{responsive:true,plugins:{legend:{display:false}}}});
}

function relVendasDia(){const hoje=new Date().toLocaleDateString(); const vendasHoje=vendas.filter(v=>v.data?.seconds && new Date(v.data.seconds*1000).toLocaleDateString()==hoje && v.status!='estornada'); let html=`<h2 class="font-bold">VENDAS DO DIA ${hoje}</h2>`+vendasHoje.map(v=>`<div class="card"><b>VENDA ${String(v.numVenda).padStart(5,'0')}</b> - R$${Number(v.total).toFixed(2)}</div>`).join('') || '<p>Nenhuma venda</p>'; $('resultadoRel').innerHTML=html;}
function relLucroPeriodo(){if(!$('dataIni').value ||!$('dataFim').value) return alert("Selecione Data Início e Fim"); let ini=new Date($('dataIni').value + 'T00:00:00'); let fim=new Date($('dataFim').value + 'T23:59:59'); const vendasPeriodo=vendas.filter(v=>v.data?.seconds && new Date(v.data.seconds*1000)>=ini && new Date(v.data.seconds*1000)<=fim && v.status!='estornada'); let faturamento = vendasPeriodo.reduce((a,b)=>a+b.total,0); let custo = 0; vendasPeriodo.forEach(v=>{v.itens.forEach(i=>{let p=produtos.find(x=>x.id==i.id); custo += (p?.custo||0) * i.qtd})}); let lucro = faturamento - custo; $('resultadoRel').innerHTML=`<div class="card"><h2 class="font-bold">PERÍODO: ${ini.toLocaleDateString()} até ${fim.toLocaleDateString()}</h2><p>Faturamento: R$${faturamento.toFixed(2)}</p><p>Custo: R$${custo.toFixed(2)}</p><p class="font-bold">Lucro Bruto: R$${lucro.toFixed(2)}</p></div>`}
function imprimirRelatorio(){let conteudo = $('resultadoRel').innerHTML; if(conteudo=='') return alert("Gere um relatório primeiro"); $('areaImpressao').innerHTML = `<h2 style="text-align:center;color:black">${loja.nome} - RELATÓRIO</h2>`+conteudo; $('areaImpressao').style.display='block'; window.print(); $('areaImpressao').style.display='none';}

function abrirCaixa(){let valor=toNum($('valorInicial').value); db.collection("caixa").add({tipo:'abertura',valor:valor,desc:'Abertura',data:firebase.firestore.FieldValue.serverTimestamp()}); $('divAbertura').classList.add('hidden'); $('btnIniciarFech').innerText='CAIXA ABERTO';}
function iniciarFechamento(){let vendasDinheiro = vendas.filter(v=>v.forma=='Dinheiro' && v.status!='estornada').reduce((a,b)=>a+b.total,0); let vendasCartao = vendas.filter(v=>v.forma=='Cartão' && v.status!='estornada').reduce((a,b)=>a+b.total,0); let vendasPix = vendas.filter(v=>v.forma=='Pix' && v.status!='estornada').reduce((a,b)=>a+b.total,0); let entradas = movCaixa.filter(m=>m.tipo=='entrada').reduce((a,b)=>a+b.valor,0); let saidas = movCaixa.filter(m=>m.tipo=='saida').reduce((a,b)=>a+Math.abs(b.valor),0); $('totalDinheiro').innerText=vendasDinheiro.toFixed(2); $('totalCartao').innerText=vendasCartao.toFixed(2); $('totalPix').innerText=vendasPix.toFixed(2); $('totalEntradas').innerText=entradas.toFixed(2); $('totalSaidas').innerText=saidas.toFixed(2); let deveriaTer = toNum($('valorInicial').value) + vendasDinheiro + entradas - saidas; $('valorDeveriaTer').innerText = deveriaTer.toFixed(2); $('divFechamento').classList.remove('hidden'); carregarExtratoCaixa();}
function confirmarFechamento(){let contado=toNum($('valorContado').value); let deveria=toNum($('valorDeveriaTer').innerText); let diferenca = contado - deveria; $('resultadoConferencia').innerText = diferenca==0?'CAIXA OK':diferenca>0?`SOBRA: R$${diferenca.toFixed(2)}`:`FALTA: R$${Math.abs(diferenca).toFixed(2)}`; db.collection("caixa").add({tipo:'fechamento',valor:-saldoCaixa,desc:`Fechamento. Dif: ${diferenca.toFixed(2)}`,data:firebase.firestore.FieldValue.serverTimestamp()}); $('divFechamento').classList.add('hidden'); $('divAbertura').classList.remove('hidden'); $('btnIniciarFech').innerText='INICIAR FECHAMENTO'; alert("Caixa Fechado! Gerando relatório..."); imprimirRelatorioFechamento(contado, deveria, diferenca);}
function entradaCaixa(){if(!$('mValor').value) return alert("Digite o valor"); db.collection("caixa").add({tipo:'entrada',valor:toNum($('mValor').value),desc:$('mDesc').value,data:firebase.firestore.FieldValue.serverTimestamp()}); $('mValor').value=''; $('mDesc').value='';}
function saidaCaixa(){if(!$('mValor').value) return alert("Digite o valor"); db.collection("caixa").add({tipo:'saida',valor:-toNum($('mValor').value),desc:$('mDesc').value,data:firebase.firestore.FieldValue.serverTimestamp()}); $('mValor').value=''; $('mDesc').value='';}
function addPrimeiro(){let filtro = produtos.filter(p=>p.nome.toLowerCase().includes($('buscaProd').value.toLowerCase())); if(filtro.length == 1) { addCarrinho(filtro[0].id); $('buscaProd').value='';}}
function baixarBackup(){let backup={produtos,clientes,fornecedores,vendas}; let blob=new Blob([JSON.stringify(backup)],{type:'application/json'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=`backup_d2.json`; a.click();}
function restaurarBackup(event){let file=event.target.files[0]; let reader=new FileReader(); reader.onload=(e)=>{alert("Backup carregado! Recarregue a pagina.");}; reader.readAsText(file);}
function gerarEtiquetas(){let html='<h2 style="color:black;text-align:center">ETIQUETAS</h2>'; produtos.forEach(p=>{html+=`<div style="border:1px dashed #000;padding:5px;margin:5px;display:inline-block;color:black"><b>${p.nome}</b><br>R$${Number(p.preco).toFixed(2)}</div>`}); $('areaImpressao').innerHTML=html; $('areaImpressao').style.display='block'; window.print(); $('areaImpressao').style.display='none';}
function salvarContaPagar(){let desc = $('pgDesc').value; let valorTotal = toNum($('pgValor').value); let parcelas = parseInt($('pgParcelas').value)||1; let fornecedorId = $('pgFornecedor').value; let fornecedorNome = fornecedorId? fornecedores.find(f=>f.id==fornecedorId).nomeFantasia : 'Geral'; if(valorTotal<=0 ||!desc) return alert("Preencha Descrição e Valor"); let valorParcela = valorTotal / parcelas; let dataAtual = new Date(); for(let i=1; i<=parcelas; i++){let vencimento = new Date(dataAtual); vencimento.setMonth(dataAtual.getMonth() + i - 1); db.collection("pagar").add({desc: `${desc} - Parcela ${i}/${parcelas}`, valor: valorParcela, saldo: valorParcela, vencimento: firebase.firestore.Timestamp.fromDate(vencimento), fornecedorId: fornecedorId, fornecedorNome: fornecedorNome, pago: false});} alert(`${parcelas} parcela(s) gerada(s) com sucesso!`); $('pgDesc').value=''; $('pgValor').value=''; $('pgParcelas').value='1';}
function carregarExtratoCaixa(){let hoje = new Date().toLocaleDateString(); let movHoje = movCaixa.filter(m => m.data?.seconds && new Date(m.data.seconds*1000).toLocaleDateString() == hoje); $('extratoCaixa').innerHTML = movHoje.map(m=>{let cor = m.tipo=='entrada' || m.tipo=='abertura'? 'text-green-500' : 'text-red-500'; let sinal = m.valor > 0? '+' : ''; return `<div class="flex justify-between border-b py-1"><span>${m.desc}</span><span class="${cor} font-bold">${sinal}R$${Number(m.valor).toFixed(2)}</span></div>`}).join('') || '<p>Nenhuma movimentação hoje</p>';}
function imprimirRelatorioFechamento(contado, deveria, diferenca){let html = `<h2 style="text-align:center;color:black">${loja.nome}</h2><h3 style="text-align:center;color:black">FECHAMENTO DE CAIXA</h3><p style="color:black">Data: ${new Date().toLocaleString('pt-BR')}</p><hr><p style="color:black">Dinheiro: R$${$('totalDinheiro').innerText}</p><p style="color:black">Cartão: R$${$('totalCartao').innerText}</p><p style="color:black">Pix: R$${$('totalPix').innerText}</p><p style="color:black">Entradas: R$${$('totalEntradas').innerText}</p><p style="color:black">Saídas: R$${$('totalSaidas').innerText}</p><hr><p style="color:black">Deveria Ter: R$${deveria.toFixed(2)}</p><p style="color:black">Foi Contado: R$${contado.toFixed(2)}</p><p style="color:black"><b>Diferença: R$${diferenca.toFixed(2)}</b></p>`; $('areaImpressao').innerHTML=html; $('areaImpressao').style.display='block'; window.print(); $('areaImpressao').style.display='none';}

// FUNÇÕES DO LEITOR DE CÓDIGO COM TRAVA DE 3 SEGUNDOS
function iniciarLeitor(){
  if(leitorAtivo) return;
  leitorAtivo = true;
  travado = false;
  ultimoCodigoLido = "";
  $('btnParar').classList.remove('hidden');

  const script = document.createElement('script');
  script.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
  script.onload = () => {
    const html5QrCode = new Html5Qrcode("leitor");
    window.html5QrCodeInstance = html5QrCode;

    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 3, qrbox: { width: 250, height: 100 } },
      (codigo) => {
        if(travado) return;
        if(codigo === ultimoCodigoLido) return;

        travado = true;
        ultimoCodigoLido = codigo;

        let prod = produtos.find(p => p.cod == codigo);
        if(prod){
          addCarrinho(prod.id);
          navigator.vibrate(200);
          let beep = new Audio('https://actions.google.com/sounds/v1/cart_checkout/digital_payment_01.ogg');
          beep.play();
        } else {
          alert("Produto não encontrado: " + codigo);
        }

        html5QrCode.stop().then(() => {
          setTimeout(() => {
            travado = false;
            if(leitorAtivo) html5QrCode.start({ facingMode: "environment" }, { fps: 3, qrbox: { width: 250, height: 100 } }, arguments.callee);
          }, 3000);
        }).catch(err => console.log(err));
},
      (erro) => { }
    ).catch(err => { console.log("Erro câmera: ", err); pararLeitor(); });
  };
  document.head.appendChild(script);
}

function pararLeitor(){
  leitorAtivo = false;
  travado = false;
  $('btnParar').classList.add('hidden');
  if(window.html5QrCodeInstance){
    window.html5QrCodeInstance.stop().catch(err=>{});
  }
  $('leitor').innerHTML = '';
}

$('buscaProd').addEventListener('keyup', function(e){
  if(e.key === 'Enter'){ addPrimeiro(); }
