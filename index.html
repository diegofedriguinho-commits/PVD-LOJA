<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV Web</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    body { font-family: 'Inter', sans-serif; }
    .hidden { display: none; }
</style>
</head>
<body class="bg-gray-100">

<div id="auth-container" class="flex items-center justify-center min-h-screen">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold text-center mb-6">PDV Login</h1>
        <input id="email" type="email" placeholder="Email" class="w-full p-2 border rounded mb-4">
        <input id="password" type="password" placeholder="Senha" class="w-full p-2 border rounded mb-4">
        <button onclick="logar()" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Entrar</button>
        <button onclick="cadastrar()" class="w-full bg-gray-600 text-white p-2 rounded hover:bg-gray-700 mt-2">Cadastrar</button>
        <p id="auth-error" class="text-red-500 text-center mt-4"></p>
    </div>
</div>

<div id="app-container" class="hidden p-4">
    <h1 class="text-3xl font-bold">PDV Funcionando!</h1>
    <button onclick="sair()" class="bg-red-600 text-white p-2 rounded mt-4">Sair</button>
</div>

<script type="module">
    // VERSÃO 11.8.1 - ESTÁVEL
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";

    const firebaseConfig = {
  apiKey: "AIzaSyBaR2gOjcWkQ625WuVPFFcZndrsKk3MqGY",
  authDomain: "web-pdv-6546d.firebaseapp.com",
  projectId: "web-pdv-6546d",
  storageBucket: "web-pdv-6546d.firebasestorage.app",
  messagingSenderId: "985739667688",
  appId: "1:985739667688:web:742dab33141e39fd97815d"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    window.logar = () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        signInWithEmailAndPassword(auth, email, password).catch(e => document.getElementById('auth-error').innerText = e.message);
    }
    
    window.cadastrar = () => {
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        createUserWithEmailAndPassword(auth, email, password).catch(e => document.getElementById('auth-error').innerText = e.message);
    }

    window.sair = () => signOut(auth);

    onAuthStateChanged(auth, user => {
        if (user) {
            document.getElementById('auth-container').classList.add('hidden');
            document.getElementById('app-container').classList.remove('hidden');
        } else {
            document.getElementById('auth-container').classList.remove('hidden');
            document.getElementById('app-container').classList.add('hidden');
        }
    });
</script>

</body>
</html>
