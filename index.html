<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV TESTE</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#f3f4f6}</style>
</head>
<body>
<div id="debug" class="bg-yellow-200 p-2 text-red-600 font-bold"></div>

<div id="login" class="flex items-center justify-center h-screen">
  <div class="bg-white p-6 rounded shadow w-11/12 max-w-sm">
    <h1 class="text-2xl font-bold text-center mb-4">TESTE LOGIN</h1>
    <input id="email" type="email" value="teste@teste.com" class="w-full p-3 border rounded mb-3">
    <input id="senha" type="password" value="123456" class="w-full p-3 border rounded mb-3">
    <button onclick="entrar()" class="w-full bg-blue-600 text-white p-3 rounded font-bold">ENTRAR</button>
    <p id="msg" class="text-red-500 text-center mt-2"></p>
  </div>
</div>

<div id="app" class="hidden p-4">
  <h1 class="text-2xl font-bold text-green-600">SISTEMA CARREGOU!</h1>
  <button onclick="testarFirebase()" class="bg-purple-600 text-white p-3 rounded mt-4">TESTAR FIREBASE</button>
  <div id="resultado"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const debug = (msg) => { document.getElementById('debug').innerHTML += msg + '<br>' }

try {
    const firebaseConfig = {apiKey: "AIzaSyBaR2gOjcWkQ625WuVPFFcZndrsKk3MqGY",authDomain: "web-pdv-6546d.firebaseapp.com",projectId: "web-pdv-6546d",storageBucket: "web-pdv-6546d.appspot.com",messagingSenderId: "985739667688",appId: "1:985739667688:web:742dab33141e39fd97815d"};
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    debug("Firebase OK")
    
    window.entrar = () => { 
        const e=document.getElementById('email').value, s=document.getElementById('senha').value; 
        signInWithEmailAndPassword(auth,e,s)
        .then(()=>debug("Login OK"))
        .catch(err=>{document.getElementById('msg').innerText=err.message; debug("ERRO LOGIN: " + err.message)}) 
    }
    
    onAuthStateChanged(auth, u => { 
        if(u){
            document.getElementById('login').classList.add('hidden');
            document.getElementById('app').classList.remove('hidden');
            debug("Usuario logado: " + u.email)
        }
    });

    window.testarFirebase = async () => {
        try{
            await addDoc(collection(db,"teste"),{nome:"teste", data: new Date()})
            const snap = await getDocs(collection(db,"teste"))
            document.getElementById('resultado').innerHTML = "SUCESSO! " + snap.size + " documentos no Firebase"
        }catch(e){ document.getElementById('resultado').innerHTML = "ERRO FIREBASE: " + e.message }
    }

} catch(e) {
    debug("ERRO GERAL: " + e.message)
}
</script>
</body>
</html>
