<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV IGARAÇU V16.1</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#f1f5f9;font-family:'Segoe UI',sans-serif;padding-bottom:90px}
.btn{padding:10px 14px;border-radius:8px;font-weight:bold;cursor:pointer}
.input{padding:10px;border:1px solid #ccc;border-radius:8px;width:100%}
.card{background:white;padding:16px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.aba{display:none}.ativa{display:block}
.menu{display:grid;grid-template-columns:repeat(8,1fr);position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;z-index:10}
.menu button{padding:8px;font-size:9px}
.menu .on{background:#2563eb;color:white}
.hidden{display:none}
@media print {.no-print{display:none} body{background:white}}
</style>
</head>
<body>

<div id="login" class="h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-sm">
    <h1 class="text-center text-2xl font-bold mb-4">PDV IGARAÇU</h1>
    <input id="email" value="admin@admin.com" class="input mb-2">
    <input id="senha" type="password" value="123456" class="input mb-2">
    <button onclick="entrar()" class="w-full btn bg-blue-600 text-white">ENTRAR</button>
  </div>
</div>

<div id="app" class="hidden">
<header class="bg-blue-600 text-white p-3 flex justify-between items-center sticky top-0 z-20 no-print">
  <b>PDV IGARAÇU</b><button onclick="sair()" class="bg-red-500 px-3 py-1 rounded">SAIR</button>
</header>

<div class="p-2 pb-24">
  <!-- VENDAS -->
  <div id="venda" class="aba ativa">
    <div class="grid lg:grid-cols-2 gap-2">
      <div class="card">
        <h2 class="font-bold mb-2">1. PRODUTOS</h2>
        <input id="buscaProd" onkeyup="buscarProd()" class="input mb-2" placeholder="Buscar produto">
        <div id="listaProd" class="max-h-80 overflow-y-auto"></div>
      </div>
      <div class="card">
        <h2 class="font-bold mb-2">2. CARRINHO</h2>
        <div id="carrinho" class="max-h-40 overflow-y-auto"></div>
        <p class="text-3xl font-bold text-center mt-2">Total: R$ <span id="total">0.00</span></p>
        <select id="formaPag" class="input mt-2">
          <option value="Dinheiro">DINHEIRO</option>
          <option value="Cartão">CARTÃO</option>
          <option value="Pix">PIX</option>
          <option value="Prazo">PRAZO</option>
        </select>
        <select id="clienteVenda" class="input mt-2"><option value="">Cliente Avulso</option></select>
        <button onclick="finalizarVenda()" class="w-full btn bg-green-600 text-white mt-2">FINALIZAR VENDA</button>
      </div>
    </div>
  </div>

  <!-- PRODUTOS -->
  <div id="produtos" class="aba">
    <div class="card mb-2"><h2 class="font-bold mb-2">CADASTRO PRODUTO</h2>
      <input type="hidden" id="pId">
      <div class="grid md:grid-cols-4 gap-2">
        <input id="pNome" class="input" placeholder="Nome">
        <input id="pCod" class="input" placeholder="Código Barras">
        <input id="pCusto" type="number" step="0.01" class="input" placeholder="Preço Custo">
        <input id="pPreco" type="number" step="0.01" class="input" placeholder="Preço Venda">
        <input id="pEstoque" type="number" class="input" placeholder="Estoque">
      </div>
      <button onclick="salvarProduto()" class="w-full btn bg-blue-600 text-white mt-2">SALVAR</button>
    </div>
    <div id="listaProdutos" class="grid md:grid-cols-2 gap-2"></div>
  </div>

  <!-- CLIENTES -->
  <div id="clientes" class="aba">
    <div class="card mb-2"><h2 class="font-bold mb-2">CADASTRO CLIENTE</h2>
      <input type="hidden" id="cId">
      <input id="cNome" class="input mb-2" placeholder="Nome">
      <input id="cTel" class="input mb-2" placeholder="Telefone">
      <button onclick="salvarCliente()" class="w-full btn bg-blue-600 text-white">SALVAR</button>
    </div>
    <div id="listaClientes" class="grid md:grid-cols-2 gap-2"></div>
  </div>

  <!-- CONTAS A RECEBER -->
  <div id="receber" class="aba">
    <div class="card mb-2"><h2 class="font-bold mb-2">CONTAS A RECEBER</h2></div>
    <div id="listaReceber" class="grid gap-2"></div>
  </div>

  <!-- CONTAS A PAGAR -->
  <div id="pagar" class="aba">
    <div class="card mb-2"><h2 class="font-bold mb-2">CADASTRAR CONTA A PAGAR</h2>
      <input id="pgDesc" class="input mb-2" placeholder="Descrição">
      <input id="pgValor" type="number" class="input mb-2" placeholder="Valor Total">
      <input id="pgParcelas" type="number" value="1" class="input mb-2" placeholder="Qtd Parcelas">
      <button onclick="salvarContaPagar()" class="w-full btn bg-red-600 text-white">SALVAR CONTA</button>
    </div>
    <div id="listaPagar" class="grid gap-2"></div>
  </div>

  <!-- RELATORIOS -->
  <div id="relatorios" class="aba">
    <div class="card mb-2"><h2 class="font-bold mb-2">RELATÓRIOS</h2>
      <button onclick="relVendas()" class="btn bg-purple-600 text-white">Vendas por Pagamento</button>
    </div>
    <div id="resultadoRel"></div>
  </div>

  <!-- CAIXA -->
  <div id="caixa" class="aba">
    <div class="grid md:grid-cols-2 gap-2">
      <div class="card"><h2 class="font-bold mb-2">CAIXA: R$ <span id="saldoCaixa">0.00</span></h2>
        <button onclick="fecharCaixa()" class="w-full btn bg-red-600 text-white mt-2">FECHAR CAIXA</button>
      </div>
      <div class="card"><h2 class="font-bold mb-2">MOVIMENTAÇÃO</h2>
        <input id="mValor" type="number" class="input mb-2" placeholder="Valor">
        <input id="mDesc" class="input mb-2" placeholder="Descrição">
        <button onclick="entradaCaixa()" class="btn bg-green-600 text-white">ENTRADA</button>
        <button onclick="saidaCaixa()" class="btn bg-red-600 text-white">SAÍDA</button>
      </div>
    </div>
  </div>
</div>

<div id="cupom" class="hidden"></div>

<nav class="menu no-print">
  <button onclick="mostrarAba('venda')" id="btn-venda" class="on">VENDAS</button>
  <button onclick="mostrarAba('produtos')" id="btn-produtos">PRODUTOS</button>
  <button onclick="mostrarAba('clientes')" id="btn-clientes">CLIENTES</button>
  <button onclick="mostrarAba('receber')" id="btn-receber">A RECEBER</button>
  <button onclick="mostrarAba('pagar')" id="btn-pagar">A PAGAR</button>
  <button onclick="mostrarAba('relatorios')" id="btn-relatorios">RELAT</button>
  <button onclick="mostrarAba('caixa')" id="btn-caixa">CAIXA</button>
</nav>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const firebaseConfig = {apiKey: "AIzaSyBaR2gOjcWkQ625WuVPFFcZndrsKk3MqGY",authDomain: "web-pdv-6546d.firebaseapp.com",projectId: "web-pdv-6546d"};
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
const $=id=>document.getElementById(id);
let produtos=[], clientes=[], vendas=[], receber=[], pagar=[], movCaixa=[], carrinho=[], total=0, saldoCaixa=0;

window.mostrarAba=id=>{document.querySelectorAll('.aba').forEach(a=>a.classList.remove('ativa'));$(id).classList.add('ativa');document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('on'));$(`btn-${id}`).classList.add('on');}
window.entrar=()=>signInWithEmailAndPassword(auth,$('email').value,$('senha').value).catch(e=>alert("Erro login"))
window.sair=()=>signOut(auth);

onAuthStateChanged(auth,u=>{
  if(u){$('login').classList.add('hidden');$('app').classList.remove('hidden'); carregarTudo();}
  else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}
});

function carregarTudo(){
  onSnapshot(collection(db,"produtos"),snap=>{produtos=snap.docs.map(d=>({id:d.id,...d.data()})); buscarProd(); listarProdutos();});
  onSnapshot(collection(db,"clientes"),snap=>{clientes=snap.docs.map(d=>({id:d.id,...d.data()})); listarClientes(); carregarClientesSelect();});
  onSnapshot(collection(db,"vendas"),snap=>{vendas=snap.docs.map(d=>({id:d.id,...d.data()}));});
  onSnapshot(collection(db,"receber"),snap=>{receber=snap.docs.map(d=>({id:d.id,...d.data()})); listarReceber();});
  onSnapshot(collection(db,"pagar"),snap=>{pagar=snap.docs.map(d=>({id:d.id,...d.data()})); listarPagar();});
  onSnapshot(collection(db,"caixa"),snap=>{movCaixa=snap.docs.map(d=>({id:d.id,...d.data()})); saldoCaixa=movCaixa.reduce((a,d)=>a+d.valor,0); $('saldoCaixa').innerText=saldoCaixa.toFixed(2)});
}

// PRODUTOS E CLIENTES
window.buscarProd=()=>{$('listaProd').innerHTML=produtos.map(p=>`<div onclick="addCarrinho('${p.id}')" class="p-2 border-b cursor-pointer">${p.nome} - R$${p.preco.toFixed(2)} [${p.estoque}]</div>`).join('')}
window.listarProdutos=()=>{$('listaProdutos').innerHTML=produtos.map(p=>`<div class="card"><b>${p.nome}</b><br>R$${p.preco} | Est:${p.estoque}</div>`).join('')}
window.salvarProduto=async()=>{await addDoc(collection(db,"produtos"),{nome:$('pNome').value,cod:$('pCod').value,custo:parseFloat($('pCusto').value)||0,preco:parseFloat($('pPreco').value)||0,estoque:parseInt($('pEstoque').value)||0});}
window.listarClientes=()=>{$('listaClientes').innerHTML=clientes.map(c=>`<div class="card"><b>${c.nome}</b><br>${c.tel}</div>`).join('')}
window.salvarCliente=async()=>{await addDoc(collection(db,"clientes"),{nome:$('cNome').value,tel:$('cTel').value}); $('cNome').value='';$('cTel').value='';}
function carregarClientesSelect(){$('clienteVenda').innerHTML='<option value="">Cliente Avulso</option>'+clientes.map(c=>`<option value="${c.id}">${c.nome}</option>`).join('')}

// CARRINHO
window.addCarrinho=async id=>{
  let p=produtos.find(x=>x.id==id);if(!p||p.estoque<=0)return alert("Sem estoque");
  let item=carrinho.find(i=>i.id==id);
  if(item){item.qtd++; item.total=item.qtd*p.preco}else{carrinho.push({id:p.id,nome:p.nome,preco:p.preco,qtd:1,total:p.preco})}
  atualizarCarrinho();
}
window.remCarrinho=async id=>{
  let item=carrinho.find(i=>i.id==id);
  if(item.qtd>1){item.qtd--; item.total=item.qtd*item.preco}else{carrinho=carrinho.filter(i=>i.id!=id)}
  atualizarCarrinho();
}
window.atualizarCarrinho=()=>{
  $('carrinho').innerHTML=carrinho.map(i=>`<div class="flex justify-between border-b py-1"><div>${i.nome}</div><div><button onclick="remCarrinho('${i.id}')" class="bg-red-500 text-white px-2 rounded">-</button> ${i.qtd} <button onclick="addCarrinho('${i.id}')" class="bg-green-500 text-white px-2 rounded">+</button></div><div>R$${i.total.toFixed(2)}</div></div>`).join('');
  total=carrinho.reduce((a,i)=>a+i.total,0);$('total').innerText=total.toFixed(2);
}

// VENDAS COM FORMA DE PAGAMENTO
window.finalizarVenda=async()=>{
  if(carrinho.length==0)return alert("Carrinho vazio");
  let forma=$('formaPag').value; let clienteId=$('clienteVenda').value;
  let vendaRef=await addDoc(collection(db,"vendas"),{itens:carrinho,total,forma,clienteId,data:serverTimestamp()});
  for(let i of carrinho){let p=produtos.find(x=>x.id==i.id);await updateDoc(doc(db,"produtos",i.id),{estoque:p.estoque-i.qtd})}
  
  if(forma=='Prazo' && clienteId){
    await addDoc(collection(db,"receber"),{clienteId,cliente:clientes.find(c=>c.id==clienteId).nome,valorTotal:total,valorPago:0,saldo:total,vendaId:vendaRef.id,data:serverTimestamp()})
  }else{
    await addDoc(collection(db,"caixa"),{tipo:'entrada',valor:total,desc:`Venda ${forma}`,data:serverTimestamp()});
  }
  imprimirCupom(carrinho,total,vendaRef.id,forma);
  carrinho=[];total=0;atualizarCarrinho();
}

// CONTAS A RECEBER
window.listarReceber=()=>{$('listaReceber').innerHTML=receber.map(r=>`<div class="card border-yellow-500"><b>${r.cliente}</b><br>Total: R$${r.valorTotal.toFixed(2)} | Pago: R$${r.valorPago.toFixed(2)} | Saldo: R$${r.saldo.toFixed(2)}<div class="mt-2"><input id="rec${r.id}" type="number" class="input" placeholder="Valor a receber"><button onclick="receberParcial('${r.id}')" class="btn bg-green-600 text-white mt-1">RECEBER</button></div></div>`).join('')}
window.receberParcial=async(id)=>{
  let r=receber.find(x=>x.id==id); let valor=parseFloat($(`rec${id}`).value);
  if(valor<=0 || valor>r.saldo)return alert("Valor inválido");
  let novoPago=r.valorPago+valor; let novoSaldo=r.saldo-valor;
  await updateDoc(doc(db,"receber",id),{valorPago:novoPago,saldo:novoSaldo});
  await addDoc(collection(db,"caixa"),{tipo:'entrada',valor:valor,desc:`Recebimento ${r.cliente}`,data:serverTimestamp()});
  if(novoSaldo==0)alert("Conta quitada!");
}

// CONTAS A PAGAR
window.salvarContaPagar=async()=>{
  let valor=parseFloat($('pgValor').value); let parcelas=parseInt($('pgParcelas').value);
  let valorParcela=valor/parcelas;
  for(let i=1;i<=parcelas;i++){
    await addDoc(collection(db,"pagar"),{desc:`${$('pgDesc').value} - Parcela ${i}/${parcelas}`,valor:valorParcela,pago:false,data:serverTimestamp()})
  }
  alert("Conta cadastrada em "+parcelas+"x");
}
window.listarPagar=()=>{$('listaPagar').innerHTML=pagar.map(p=>`<div class="card ${p.pago?'border-green-500':'border-red-500'}"><b>${p.desc}</b><br>R$${p.valor.toFixed(2)} ${p.pago?'(PAGO)':''}<br>${!p.pago?`<button onclick="pagarParcela('${p.id}')" class="btn bg-red-600 text-white mt-1">PAGAR</button>`:''}</div>`).join('')}
window.pagarParcela=async(id)=>{
  await updateDoc(doc(db,"pagar",id),{pago:true});
  let p=pagar.find(x=>x.id==id);
  await addDoc(collection(db,"caixa"),{tipo:'saida',valor:-p.valor,desc:`Pagto ${p.desc}`,data:serverTimestamp()});
}

// RELATORIOS
window.relVendas=()=>{$('resultadoRel').innerHTML=`<div class="card">Dinheiro: R$${vendas.filter(v=>v.forma=='Dinheiro').reduce((a,b)=>a+b.total,0).toFixed(2)}</div><div class="card">Cartão: R$${vendas.filter(v=>v.forma=='Cartão').reduce((a,b)=>a+b.total,0).toFixed(2)}</div><div class="card">Pix: R$${vendas.filter(v=>v.forma=='Pix').reduce((a,b)=>a+b.total,0).toFixed(2)}</div><div class="card">Prazo: R$${vendas.filter(v=>v.forma=='Prazo').reduce((a,b)=>a+b.total,0).toFixed(2)}</div>`}

// CAIXA
window.entradaCaixa=async()=>{await addDoc(collection(db,"caixa"),{tipo:'entrada',valor:parseFloat($('mValor').value),desc:$('mDesc').value,data:serverTimestamp()})}
window.saidaCaixa=async()=>{await addDoc(collection(db,"caixa"),{tipo:'saida',valor:-parseFloat($('mValor').value),desc:$('mDesc').value,data:serverTimestamp()})}
window.fecharCaixa=()=>{imprimirFechamento(); addDoc(collection(db,"caixa"),{tipo:'fechamento',valor:-saldoCaixa,desc:'Fechamento',data:serverTimestamp()})}

window.imprimirCupom=(itens,total,id,forma)=>{
  let html=`<div style="width:300px;font-family:monospace"><h2>PDV IGARAÇU</h2><p>PAGTO: ${forma}</p><hr>`;
  itens.forEach(i=>html+=`<div>${i.nome} ${i.qtd}x R$${i.preco.toFixed(2)}</div>`);
  html+=`<hr><h3>TOTAL: R$${total.toFixed(2)}</h3></div>`;
  $('cupom').innerHTML=html;setTimeout(()=>window.print(),100);
}
window.imprimirFechamento=()=>{
  let entradas=movCaixa.filter(m=>m.tipo=='entrada').reduce((a,b)=>a+b.valor,0);
  let saidas=movCaixa.filter(m=>m.tipo=='saida').reduce((a,b)=>a+b.valor,0);
  let html=`<div style="width:300px;font-family:monospace"><h2>FECHAMENTO CAIXA</h2><p>Entradas: R$${entradas.toFixed(2)}</p><p>Saídas: R$${Math.abs(saidas).toFixed(2)}</p><hr><h3>SALDO: R$${saldoCaixa.toFixed(2)}</h3></div>`;
  $('cupom').innerHTML=html;setTimeout(()=>window.print(),100);
}
</script>
</body>
</html>
