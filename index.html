<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV IGARAÇU V14</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#f1f5f9;font-family:'Segoe UI',sans-serif;padding-bottom:90px}
.btn{padding:10px 14px;border-radius:8px;font-weight:bold;cursor:pointer}
.input{padding:10px;border:1px solid #ccc;border-radius:8px;width:100%}
.card{background:white;padding:16px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.aba{display:none}.ativa{display:block}
.menu{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;z-index:10}
.menu button{padding:8px;font-size:10px}
.menu .on{background:#2563eb;color:white}
.badge{background:#ef4444;color:white;border-radius:999px;padding:2px 6px;font-size:10px}
.hidden{display:none}
@media print {.no-print{display:none} body{background:white}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" class="h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-sm">
    <h1 class="text-center text-2xl font-bold mb-4">PDV IGARAÇU</h1>
    <input id="email" value="admin@admin.com" class="input mb-2" placeholder="Email">
    <input id="senha" type="password" value="123456" class="input mb-2" placeholder="Senha">
    <button onclick="entrar()" class="w-full btn bg-blue-600 text-white">ENTRAR</button>
    <p id="erro" class="text-red-500 text-center mt-2 text-sm"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
<header class="bg-blue-600 text-white p-3 flex justify-between items-center sticky top-0 z-20 no-print">
  <b>PDV IGARAÇU</b><button onclick="sair()" class="bg-red-500 px-3 py-1 rounded">SAIR</button>
</header>

<div class="p-2 pb-24">
  <!-- VENDAS -->
  <div id="venda" class="aba ativa">
    <div class="grid lg:grid-cols-2 gap-2">
      <div class="card">
        <h2 class="font-bold mb-2">1. PRODUTOS</h2>
        <input id="buscaProd" onkeyup="buscarProd()" class="input mb-2" placeholder="Buscar produto">
        <div id="listaProd" class="max-h-80 overflow-y-auto"></div>
      </div>
      <div class="card">
        <h2 class="font-bold mb-2">2. CARRINHO</h2>
        <div id="carrinho" class="max-h-60 overflow-y-auto"></div>
        <p class="text-3xl font-bold text-center mt-2">Total: R$ <span id="total">0.00</span></p>
        <button onclick="finalizarVenda()" class="w-full btn bg-green-600 text-white mt-2">FINALIZAR VENDA</button>
      </div>
    </div>
  </div>

  <!-- PRODUTOS -->
  <div id="produtos" class="aba">
    <div class="card mb-2"><h2 class="font-bold mb-2">CADASTRO PRODUTO</h2>
      <div class="grid md:grid-cols-3 gap-2">
        <input id="pNome" class="input" placeholder="Nome">
        <input id="pPreco" type="number" step="0.01" class="input" placeholder="Preço Venda">
        <input id="pCusto" type="number" step="0.01" class="input" placeholder="Preço Custo">
        <input id="pEstoque" type="number" class="input" placeholder="Estoque">
        <input id="pMin" type="number" class="input" placeholder="Estoque Mínimo">
        <input id="pCod" class="input" placeholder="Código Barras">
      </div>
      <button onclick="salvarProduto()" class="w-full btn bg-blue-600 text-white mt-2">SALVAR PRODUTO</button>
    </div>
    <div id="listaProdutos" class="grid md:grid-cols-2 gap-2"></div>
  </div>

  <!-- CLIENTES -->
  <div id="clientes" class="aba">
    <div class="card mb-2"><h2 class="font-bold mb-2">CADASTRO CLIENTE</h2>
      <input type="hidden" id="cId">
      <div class="grid md:grid-cols-3 gap-2">
        <input id="cNome" class="input" placeholder="Nome Completo">
        <input id="cTel" class="input" placeholder="Telefone">
        <input id="cCpf" class="input" placeholder="CPF">
        <input id="cEnd" class="input md:col-span-3" placeholder="Endereço">
      </div>
      <button onclick="salvarCliente()" class="w-full btn bg-blue-600 text-white mt-2">SALVAR CLIENTE</button>
    </div>
    <div id="listaClientes" class="grid md:grid-cols-2 gap-2"></div>
  </div>

  <!-- FORNECEDORES -->
  <div id="fornecedores" class="aba">
    <div class="card mb-2"><h2 class="font-bold mb-2">CADASTRO FORNECEDOR</h2>
      <input type="hidden" id="fId">
      <div class="grid md:grid-cols-3 gap-2">
        <input id="fNome" class="input" placeholder="Razão Social">
        <input id="fTel" class="input" placeholder="Telefone">
        <input id="fCnpj" class="input" placeholder="CNPJ">
      </div>
      <button onclick="salvarFornecedor()" class="w-full btn bg-blue-600 text-white mt-2">SALVAR FORNECEDOR</button>
    </div>
    <div id="listaFornecedores"></div>
  </div>

  <!-- RELATORIOS -->
  <div id="relatorios" class="aba">
    <div class="card mb-2"><h2 class="font-bold mb-2">RELATÓRIOS E VENDAS</h2>
      <button onclick="relVendas()" class="btn bg-purple-600 text-white mr-2">Vendas Hoje</button>
      <button onclick="relEstoqueBaixo()" class="btn bg-orange-600 text-white">Estoque Baixo</button>
    </div>
    <div id="listaVendas" class="grid gap-2"></div>
  </div>

  <!-- CAIXA -->
  <div id="caixa" class="aba">
    <div class="grid md:grid-cols-2 gap-2">
      <div class="card"><h2 class="font-bold mb-2">CAIXA</h2>
        <p class="text-4xl font-bold text-center text-green-600">R$ <span id="saldoCaixa">0.00</span></p>
        <button onclick="abrirCaixa()" class="w-full btn bg-green-600 text-white mt-2">ABRIR CAIXA</button>
        <button onclick="fecharCaixa()" class="w-full btn bg-red-600 text-white mt-2">FECHAR CAIXA</button>
      </div>
      <div class="card"><h2 class="font-bold mb-2">MOVIMENTAÇÃO</h2>
        <input id="mValor" type="number" class="input mb-2" placeholder="Valor">
        <input id="mDesc" class="input mb-2" placeholder="Descrição">
        <button onclick="entradaCaixa()" class="btn bg-green-600 text-white">ENTRADA</button>
        <button onclick="saidaCaixa()" class="btn bg-red-600 text-white">SAÍDA</button>
      </div>
    </div>
  </div>
</div>

<!-- CUPOM IMPRESSÃO -->
<div id="cupom" class="hidden"></div>

<nav class="menu no-print">
  <button onclick="mostrarAba('venda')" id="btn-venda" class="on">VENDAS</button>
  <button onclick="mostrarAba('produtos')" id="btn-produtos">PRODUTOS</button>
  <button onclick="mostrarAba('clientes')" id="btn-clientes">CLIENTES</button>
  <button onclick="mostrarAba('fornecedores')" id="btn-fornecedores">FORNEC</button>
  <button onclick="mostrarAba('relatorios')" id="btn-relatorios">RELAT</button>
  <button onclick="mostrarAba('caixa')" id="btn-caixa">CAIXA</button>
</nav>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const firebaseConfig = {apiKey: "AIzaSyBaR2gOjcWkQ625WuVPFFcZndrsKk3MqGY",authDomain: "web-pdv-6546d.firebaseapp.com",projectId: "web-pdv-6546d"};
const app = initializeApp(firebaseConfig); const auth = getAuth(app); const db = getFirestore(app);
const $=id=>document.getElementById(id);
let produtos=[], clientes=[], fornecedores=[], vendas=[], carrinho=[], total=0, saldoCaixa=0;

window.mostrarAba=id=>{document.querySelectorAll('.aba').forEach(a=>a.classList.remove('ativa'));$(id).classList.add('ativa');document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('on'));$(`btn-${id}`).classList.add('on'); if(id=='relatorios') carregarVendas();}
window.entrar=()=>signInWithEmailAndPassword(auth,$('email').value,$('senha').value).catch(e=>$('erro').innerText="Erro: "+e.message)
window.sair=()=>signOut(auth);

onAuthStateChanged(auth,u=>{
  if(u){$('login').classList.add('hidden');$('app').classList.remove('hidden'); carregarTudo();}
  else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}
});

function carregarTudo(){
  onSnapshot(collection(db,"produtos"),snap=>{produtos=snap.docs.map(d=>({id:d.id,...d.data()})); buscarProd(); listarProdutos();});
  onSnapshot(collection(db,"clientes"),snap=>{clientes=snap.docs.map(d=>({id:d.id,...d.data()})); listarClientes();});
  onSnapshot(collection(db,"fornecedores"),snap=>{fornecedores=snap.docs.map(d=>({id:d.id,...d.data()})); listarFornecedores();});
  onSnapshot(collection(db,"caixa"),snap=>{saldoCaixa=snap.docs.reduce((a,d)=>a+d.data().valor,0); $('saldoCaixa').innerText=saldoCaixa.toFixed(2)});
}

// PRODUTOS
window.buscarProd=()=>{$('listaProd').innerHTML=produtos.map(p=>`<div onclick="addCarrinho('${p.id}')" class="p-2 border-b cursor-pointer hover:bg-gray-100 flex justify-between">${p.nome} <span>R$${p.preco.toFixed(2)} <span class="badge">${p.estoque}</span></span></div>`).join('')}
window.listarProdutos=()=>{$('listaProdutos').innerHTML=produtos.map(p=>`<div class="card ${p.estoque<=p.min?'border-red-500':''}"><b>${p.nome}</b><br>Estoque: ${p.estoque} | Preço: R$${p.preco.toFixed(2)}</div>`).join('')}
window.salvarProduto=async()=>{await addDoc(collection(db,"produtos"),{nome:$('pNome').value,preco:parseFloat($('pPreco').value),custo:parseFloat($('pCusto').value),estoque:parseInt($('pEstoque').value),min:parseInt($('pMin').value),cod:$('pCod').value});limparProd();alert("Produto salvo")}
function limparProd(){$('pNome').value='';$('pPreco').value='';$('pCusto').value='';$('pEstoque').value='';$('pMin').value='';$('pCod').value=''}

// CLIENTES CRUD
window.listarClientes=()=>{$('listaClientes').innerHTML=clientes.map(c=>`<div class="card"><b>${c.nome}</b><br>${c.tel} | ${c.cpf}<div class="mt-2"><button onclick="editarCliente('${c.id}')" class="btn bg-yellow-500 text-white text-sm">EDITAR</button> <button onclick="excluirCliente('${c.id}')" class="btn bg-red-500 text-white text-sm">EXCLUIR</button></div></div>`).join('')}
window.salvarCliente=async()=>{let data={nome:$('cNome').value,tel:$('cTel').value,cpf:$('cCpf').value,end:$('cEnd').value}; if($('cId').value){await updateDoc(doc(db,"clientes",$('cId').value),data)}else{await addDoc(collection(db,"clientes"),data)} limparCliente();alert("Cliente salvo")}
window.editarCliente=id=>{let c=clientes.find(x=>x.id==id);$('cId').value=c.id;$('cNome').value=c.nome;$('cTel').value=c.tel;$('cCpf').value=c.cpf;$('cEnd').value=c.end}
window.excluirCliente=async id=>{if(confirm("Excluir cliente?"))await deleteDoc(doc(db,"clientes",id))}
function limparCliente(){$('cId').value='';$('cNome').value='';$('cTel').value='';$('cCpf').value='';$('cEnd').value=''}

// FORNECEDORES CRUD
window.listarFornecedores=()=>{$('listaFornecedores').innerHTML=fornecedores.map(f=>`<div class="card mb-1"><b>${f.nome}</b><br>${f.tel} | ${f.cnpj}<div class="mt-2"><button onclick="editarFornecedor('${f.id}')" class="btn bg-yellow-500 text-white text-sm">EDITAR</button> <button onclick="excluirFornecedor('${f.id}')" class="btn bg-red-500 text-white text-sm">EXCLUIR</button></div></div>`).join('')}
window.salvarFornecedor=async()=>{let data={nome:$('fNome').value,tel:$('fTel').value,cnpj:$('fCnpj').value}; if($('fId').value){await updateDoc(doc(db,"fornecedores",$('fId').value),data)}else{await addDoc(collection(db,"fornecedores"),data)} limparFornecedor();alert("Fornecedor salvo")}
window.editarFornecedor=id=>{let f=fornecedores.find(x=>x.id==id);$('fId').value=f.id;$('fNome').value=f.nome;$('fTel').value=f.tel;$('fCnpj').value=f.cnpj}
window.excluirFornecedor=async id=>{if(confirm("Excluir fornecedor?"))await deleteDoc(doc(db,"fornecedores",id))}
function limparFornecedor(){$('fId').value='';$('fNome').value='';$('fTel').value='';$('fCnpj').value=''}

// VENDAS + BAIXA ESTOQUE + CARRINHO
window.addCarrinho=async id=>{
  let p=produtos.find(x=>x.id==id);if(p.estoque<=0)return alert("Sem estoque");
  let item=carrinho.find(i=>i.id==id);
  if(item){item.qtd++; item.total=item.qtd*p.preco}else{carrinho.push({id:p.id,nome:p.nome,preco:p.preco,qtd:1,total:p.preco})}
  atualizarCarrinho();
}
window.atualizarCarrinho=()=>{
  $('carrinho').innerHTML=carrinho.map(i=>`<div class="flex justify-between items-center border-b py-1">
    <div>${i.nome} <button onclick="addCarrinho('${i.id}')" class="bg-green-500 text-white px-2 rounded">+</button> ${i.qtd}x</div>
    <div>R$${i.total.toFixed(2)}</div></div>`).join('');
  total=carrinho.reduce((a,i)=>a+i.total,0);$('total').innerText=total.toFixed(2);
}
window.finalizarVenda=async()=>{
  if(carrinho.length==0)return alert("Carrinho vazio");
  let vendaRef=await addDoc(collection(db,"vendas"),{itens:carrinho,total, data:serverTimestamp()});
  for(let i of carrinho){let p=produtos.find(x=>x.id==i.id);await updateDoc(doc(db,"produtos",i.id),{estoque:p.estoque-i.qtd})}
  await addDoc(collection(db,"caixa"),{tipo:'entrada',valor:total,data:serverTimestamp()});
  imprimirCupom(carrinho,total,vendaRef.id,'1ª VIA');
  carrinho=[];total=0;atualizarCarrinho();alert("Venda finalizada!")
}

// RELATORIOS + IMPRESSÃO
async function carregarVendas(){onSnapshot(collection(db,"vendas"),snap=>{vendas=snap.docs.map(d=>({id:d.id,...d.data()}));})}
window.relVendas=()=>{$('listaVendas').innerHTML=vendas.map(v=>`<div class="card"><b>VENDA ${v.id.substring(0,5)}</b> - R$${v.total.toFixed(2)}<br><button onclick="imprimirCupom(${JSON.stringify(v.itens).replace(/"/g,'&quot;')},${v.total},'${v.id}','2ª VIA')" class="btn bg-blue-500 text-white text-sm mt-1">IMPRIMIR 2ª VIA</button></div>`).join('')}
window.relEstoqueBaixo=()=>{$('listaVendas').innerHTML=produtos.filter(p=>p.estoque<=p.min).map(p=>`<div class="card border-red-500">${p.nome} - Estoque: ${p.estoque}</div>`).join('')}

window.imprimirCupom=(itens,total,id,via)=>{
  let html=`<div style="width:300px;font-family:monospace"><h2 class="text-center">PDV IGARAÇU</h2><p class="text-center">${via}</p><p>VENDA: ${id.substring(0,8)}</p><hr>`;
  itens.forEach(i=>html+=`<div>${i.nome} ${i.qtd}x R$${i.preco.toFixed(2)}</div>`);
  html+=`<hr><h3>TOTAL: R$${total.toFixed(2)}</h3></div>`;
  $('cupom').innerHTML=html;window.print();
}

// CAIXA
window.abrirCaixa=async()=>{let v=parseFloat(prompt("Valor inicial"));if(v)await addDoc(collection(db,"caixa"),{tipo:'abertura',valor:v,data:serverTimestamp()})}
window.fecharCaixa=async()=>{await addDoc(collection(db,"caixa"),{tipo:'fechamento',valor:-saldoCaixa,data:serverTimestamp()});alert("Caixa fechado")}
window.entradaCaixa=async()=>{await addDoc(collection(db,"caixa"),{tipo:'entrada',valor:parseFloat($('mValor').value),desc:$('mDesc').value,data:serverTimestamp()})}
window.saidaCaixa=async()=>{await addDoc(collection(db,"caixa"),{tipo:'saida',valor:-parseFloat($('mValor').value),desc:$('mDesc').value,data:serverTimestamp()})}
</script>
</body>
</html>
