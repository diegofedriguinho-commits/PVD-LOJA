<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><title>PDV</title>
<script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-100">
<div id="login" class="h-screen flex items-center justify-center"><div class="bg-white p-6 rounded shadow w-80">
<h1 class="text-center text-2xl font-bold mb-4">PDV LOGIN</h1>
<input id="email" value="admin@admin.com" class="w-full border p-2 mb-2 rounded">
<input id="senha" value="123456" type="password" class="w-full border p-2 mb-2 rounded">
<button onclick="entrar()" class="w-full bg-blue-600 text-white p-2 rounded">ENTRAR</button>
<p id="erro" class="text-red-500 text-center mt-2"></p></div></div>
<div id="app" class="hidden p-4"><h1 class="text-2xl">ENTROU! ✅</h1><button onclick="sair()" class="bg-red-500 text-white p-2 rounded">SAIR</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
const firebaseConfig = {apiKey: "AIzaSyBaR2gOjcWkQ625WuVPFFcZndrsKk3MqGY",authDomain: "web-pdv-6546d.firebaseapp.com",projectId: "web-pdv-6546d"};
const app = initializeApp(firebaseConfig); const auth = getAuth(app);
const $=id=>document.getElementById(id);
window.entrar=()=>signInWithEmailAndPassword(auth,$('email').value,$('senha').value).catch(e=>$('erro').innerText=e.message)
window.sair=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(u){$('login').classList.add('hidden');$('app').classList.remove('hidden')}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')}});
</script></body></html>
