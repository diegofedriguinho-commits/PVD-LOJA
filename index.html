<script>
const firebaseConfig = {apiKey: "AIzaSyBaR2gOjcWkQ625WuVPFFcZndrsKk3MqGY",authDomain: "web-pdv-6546d.firebaseapp.com",projectId: "web-pdv-6546d"};
firebase.initializeApp(firebaseConfig); const db = firebase.firestore(); const $=id=>document.getElementById(id);
let produtos=[], clientes=[], fornecedores=[], vendas=[], receber=[], pagar=[], movCaixa=[], loja={}, carrinho=[], subtotal=0, total=0, saldoCaixa=0, ultimoNumVenda=0;
let usuarioLogado=null; const SENHA_ZERAR = "LOLA2025";
let permissoes = {caixa: {senha: '1234', podeEstornar: false, podeFecharCaixa: false}, gerente: {senha: '9999', podeEstornar: true, podeFecharCaixa: true}}

function toNum(valor){ return parseFloat(String(valor).replace(',','.')) || 0; }

function alternarTema(){document.body.classList.toggle('dark'); localStorage.setItem('tema', document.body.classList.contains('dark')?'dark':'claro')}
function alternarTelaCheia(){document.body.classList.toggle('pdv-cheio'); if(document.body.classList.contains('pdv-cheio')){document.documentElement.requestFullscreen()}else{document.exitFullscreen()}}
if(localStorage.getItem('tema')=='dark') document.body.classList.add('dark');

function mostrarAba(id){document.querySelectorAll('.aba').forEach(a=>a.classList.remove('ativa'));$(id).classList.add('ativa');document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('on'));$(`btn-${id}`).classList.add('on');}
function logar(){let user = $('usuarioLogin').value; let senha = $('senhaLogin').value; if(permissoes[user] && permissoes[user].senha == senha){usuarioLogado = user; $('telaLogin').classList.add('hidden'); verificarPermissoes(); carregarTudo(); $('buscaProd').focus();} else {$('erroLogin').innerText = 'Usuário ou Senha inválidos!';}}
function sair(){usuarioLogado = null; $('telaLogin').classList.remove('hidden'); $('senhaLogin').value=''; location.reload();}
function verificarPermissoes(){if($('btnConfirmarFech')){$('btnConfirmarFech').disabled =!permissoes[usuarioLogado].podeFecharCaixa; if(!permissoes[usuarioLogado].podeFecharCaixa) $('btnConfirmarFech').innerText = 'SÓ GERENTE';}}

// AQUI PRA BAIXO É IGUAL. SÓ TIREI O "async function" E COLOQUEI "async function"
// E CONSERTEI A VIRGULA DO SALVARPRODUTO

function carregarTudo(){
function verificarEstoqueBaixo(){let baixos = produtos.filter(p => (p.estoque||0) > 0 && (p.estoque||0) <= 5); if(baixos.length > 0){$('alertaEstoque').classList.remove('hidden'); $('listaAlertaEstoque').innerHTML = baixos.map(p=>`<p>${p.nome}: <b>${p.estoque}</b> un</p>`).join('');} else {$('alertaEstoque').classList.add('hidden');}}
function verificarValidade(){let hoje=new Date(); let prox7dias=new Date(); prox7dias.setDate(hoje.getDate()+7); let proximos=produtos.filter(p=>p.validade && new Date(p.validade)>=hoje && new Date(p.validade)<=prox7dias); if(proximos.length>0){$('alertaValidade').classList.remove('hidden'); $('listaAlertaValidade').innerHTML=proximos.map(p=>`<p>${p.nome}: Vence em ${new Date(p.validade).toLocaleDateString()}</p>`).join('')}else{$('alertaValidade').classList.add('hidden')}}
db.collection("produtos").onSnapshot(snap=>{produtos=snap.docs.map(d=>({id:d.id,...d.data()})); buscarProd(); listarProdutos(); carregarFornecedoresSelect(); verificarEstoqueBaixo(); verificarValidade();});
db.collection("clientes").onSnapshot(snap=>{clientes=snap.docs.map(d=>({id:d.id,...d.data()})); listarClientes(); carregarClientesSelect(); carregarClientesRecebimento();});
db.collection("fornecedores").onSnapshot(snap=>{fornecedores=snap.docs.map(d=>({id:d.id,...d.data()})); listarFornecedores(); carregarFornecedoresSelect();});
db.collection("vendas").orderBy("numVenda","desc").limit(1).onSnapshot(snap=>{if(!snap.empty){ultimoNumVenda=snap.docs[0].data().numVenda||0}});
db.collection("vendas").onSnapshot(snap=>{vendas=snap.docs.map(d=>({id:d.id,...d.data()}));});
db.collection("receber").onSnapshot(snap=>{receber=snap.docs.map(d=>({id:d.id,...d.data()})); listarReceber();});
db.collection("pagar").onSnapshot(snap=>{pagar=snap.docs.map(d=>({id:d.id,...d.data()})); listarPagar();});
db.collection("loja").onSnapshot(snap=>{if(!snap.empty){let docLoja = snap.docs[0]; loja=docLoja.data(); $('lId').value=docLoja.id; $('lNome').value=loja.nome||''; $('lEnd').value=loja.end||''; $('lTel').value=loja.tel||''; $('lCnpj').value=loja.cnpj||'';}else{loja={nome:'D2 SISTEMAS',end:'',tel:'',cnpj:''}}});
db.collection("caixa").onSnapshot(snap=>{movCaixa=snap.docs.map(d=>({id:d.id,...d.data()}));saldoCaixa=movCaixa.reduce((a,d)=>a+(d.valor||0),0); $('saldoCaixa').innerText=saldoCaixa.toFixed(2);const hoje=new Date(); const inicioMes=new Date(hoje.getFullYear(), hoje.getMonth(), 1);const movMes=movCaixa.filter(m=>m.data?.seconds && new Date(m.data.seconds*1000) >= inicioMes && m.tipo!= 'fechamento' && m.tipo!= 'retirada_fechamento');const entradasMes=movMes.filter(m=>m.tipo == 'entrada').reduce((a,b)=>a+(b.valor||0),0);const saidasMes=movMes.filter(m=>m.tipo == 'saida').reduce((a,b)=>a+(b.valor||0),0);$('entradasMes').innerText=entradasMes.toFixed(2);$('saidasMes').innerText=Math.abs(saidasMes).toFixed(2);$('saldoMes').innerText=(entradasMes+saidasMes).toFixed(2);});
}
