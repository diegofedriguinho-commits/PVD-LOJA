<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV Completo</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
body{font-family:'Segoe UI',sans-serif;background:#f3f4f6;padding-bottom:80px}
.btn-mobile{min-height:50px;font-size:16px}
.card-prod:active{transform:scale(0.95)}
.aba-ativa{background:#2563eb;color:white}
.alerta-banner{background:#dc2626;color:white;padding:10px;text-align:center;font-weight:bold;position:sticky;top:48px;z-index:9}
@media print { body * { visibility: hidden; } #cupom, #cupom * { visibility: visible; } #cupom { position: absolute; left: 0; top: 0; width: 80mm; } }
</style>
</head>
<body>

<!-- CUPOM DE IMPRESSÃO ESCONDIDO -->
<div id="cupom" class="hidden"></div>

<!-- BANNER DE ALERTA -->
<div id="alertaContas" class="hidden alerta-banner"></div>

<!-- TELA LOGIN -->
<div id="login" class="flex items-center justify-center h-screen">
  <div class="bg-white p-6 rounded shadow w-11/12 max-w-sm">
    <h1 class="text-2xl font-bold text-center mb-4">Login PDV</h1>
    <input id="email" type="email" placeholder="Email" class="w-full p-3 border rounded mb-3">
    <input id="senha" type="password" placeholder="Senha" class="w-full p-3 border rounded mb-3">
    <button onclick="entrar()" class="w-full bg-blue-600 text-white p-3 rounded btn-mobile font-bold">ENTRAR</button>
    <button onclick="cadastrar()" class="w-full bg-gray-600 text-white p-3 rounded btn-mobile mt-2">CADASTRAR</button>
    <p id="msg" class="text-red-500 text-center mt-2"></p>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
<header class="bg-blue-600 text-white p-3 flex justify-between sticky top-0 z-10">
  <h1 class="font-bold">PDV COMPLETO</h1>
  <button onclick="sair()" class="bg-red-500 px-3 py-1 rounded text-sm">SAIR</button>
</header>

<main class="p-2">
    <!-- 1. VENDAS -->
    <div id="aba-venda">
        <input id="busca" onkeyup="buscar()" placeholder="Buscar produto..." class="w-full p-3 border rounded mb-2">
        <div id="listaProdVenda" class="grid grid-cols-2 gap-2 mb-3"></div>
        <div class="bg-white p-3 rounded shadow">
            <h2 class="font-bold">Carrinho</h2>
            <div id="carrinho" class="max-h-40 overflow-y-auto"></div>
            <select id="clienteVenda" class="w-full p-2 border rounded mt-2"></select>
            <select id="formaPag" class="w-full p-2 border rounded mt-2">
                <option>Dinheiro</option><option>Cartão</option><option>PIX</option><option>Prazo</option>
            </select>
            <div class="flex gap-2 mt-2">
                <input id="descValor" type="number" placeholder="Desc R$" class="w-1/2 p-2 border rounded">
                <input id="descPerc" type="number" placeholder="Desc %" class="w-1/2 p-2 border rounded">
            </div>
            <button onclick="aplicarDesc()" class="w-full bg-yellow-500 text-white p-2 rounded mt-2">APLICAR DESC</button>
            <p class="text-2xl font-bold text-center mt-2">Total: R$ <span id="total">0.00</span></p>
            <button onclick="vender()" class="w-full bg-green-600 text-white p-4 rounded btn-mobile mt-2 font-bold">FINALIZAR VENDA</button>
            <button onclick="reimprimirUltima()" class="w-full bg-gray-600 text-white p-3 rounded btn-mobile mt-2">REIMPRIMIR ÚLTIMA VENDA</button>
        </div>
    </div>

    <!-- 2. PRODUTOS -->
    <div id="aba-produtos" class="hidden">
        <div class="bg-white p-3 rounded shadow mb-3">
            <h2 class="font-bold mb-2">+ Produto</h2>
            <input type="hidden" id="idProd">
            <input id="cod" placeholder="Código" class="w-full p-2 border rounded mb-2">
            <input id="nome" placeholder="Nome" class="w-full p-2 border rounded mb-2">
            <input id="custo" type="number" placeholder="Custo" class="w-full p-2 border rounded mb-2">
            <input id="preco" type="number" placeholder="Preço" class="w-full p-2 border rounded mb-2">
            <input id="estoque" type="number" placeholder="Estoque" class="w-full p-2 border rounded mb-2">
            <input id="estMin" type="number" placeholder="Estoque Mínimo" class="w-full p-2 border rounded mb-2">
            <button id="btnProd" onclick="salvarProd()" class="w-full bg-blue-600 text-white p-3 rounded btn-mobile font-bold">SALVAR</button>
        </div>
        <div id="tabelaProd" class="bg-white p-3 rounded shadow"></div>
    </div>

    <!-- 3. CLIENTES -->
    <div id="aba-clientes" class="hidden">
        <div class="bg-white p-3 rounded shadow mb-3">
            <h2 class="font-bold mb-2">+ Cliente</h2>
            <input type="hidden" id="idCli">
            <input id="nomeCli" placeholder="Nome" class="w-full p-2 border rounded mb-2">
            <input id="telCli" placeholder="Telefone" class="w-full p-2 border rounded mb-2">
            <input id="cpfCli" placeholder="CPF" class="w-full p-2 border rounded mb-2">
            <button id="btnCli" onclick="salvarCli()" class="w-full bg-blue-600 text-white p-3 rounded btn-mobile font-bold">SALVAR</button>
        </div>
        <div id="tabelaCli" class="bg-white p-3 rounded shadow"></div>
    </div>

    <!-- 4. FORNECEDORES -->
    <div id="aba-fornecedores" class="hidden">
        <div class="bg-white p-3 rounded shadow mb-3">
            <h2 class="font-bold mb-2">+ Fornecedor</h2>
            <input type="hidden" id="idFor">
            <input id="nomeFor" placeholder="Nome" class="w-full p-2 border rounded mb-2">
            <input id="telFor" placeholder="Telefone" class="w-full p-2 border rounded mb-2">
            <input id="cnpjFor" placeholder="CNPJ" class="w-full p-2 border rounded mb-2">
            <button id="btnFor" onclick="salvarFor()" class="w-full bg-blue-600 text-white p-3 rounded btn-mobile font-bold">SALVAR</button>
        </div>
        <div id="tabelaFor" class="bg-white p-3 rounded shadow"></div>
    </div>

    <!-- 5. LOJA -->
    <div id="aba-loja" class="hidden">
        <div class="bg-white p-3 rounded shadow mb-3">
            <h2 class="font-bold mb-2">Dados da Loja</h2>
            <input id="nomeLoja" placeholder="Nome da Loja" class="w-full p-2 border rounded mb-2">
            <input id="cnpjLoja" placeholder="CNPJ" class="w-full p-2 border rounded mb-2">
            <input id="telLoja" placeholder="Telefone" class="w-full p-2 border rounded mb-2">
            <input id="endLoja" placeholder="Endereço" class="w-full p-2 border rounded mb-2">
            <button onclick="salvarLoja()" class="w-full bg-blue-600 text-white p-3 rounded btn-mobile font-bold">SALVAR</button>
            <button onclick="exportarExcel()" class="w-full bg-green-600 text-white p-3 rounded btn-mobile mt-2">BAIXAR BACKUP EXCEL</button>
        </div>
        <div class="bg-white p-3 rounded shadow border-2 border-red-500">
            <h2 class="font-bold text-red-600 mb-2">ÁREA PERIGOSA</h2>
            <button onclick="zerarSistema()" class="w-full bg-red-600 text-white p-3 rounded btn-mobile font-bold">ZERAR TODO O SISTEMA</button>
        </div>
    </div>

    <<!-- 6. CONTAS A PAGAR -->
    <div id="aba-pagar" class="hidden">
        <div class="bg-white p-3 rounded shadow mb-3">
            <h2 class="font-bold mb-2">+ Conta a Pagar</h2>
            <input id="descPagar" placeholder="Descrição" class="w-full p-2 border rounded mb-2">
            <input id="valorPagar" type="number" placeholder="Valor Total" class="w-full p-2 border rounded mb-2">
            <input id="parcelasPagar" type="number" placeholder="Qtd Parcelas" value="1" class="w-full p-2 border rounded mb-2">
            <input id="vencPagar" type="date" class="w-full p-2 border rounded mb-2">
            <select id="forPagar" class="w-full p-2 border rounded mb-2"></select>
            <button onclick="salvarPagar()" class="w-full bg-red-600 text-white p-3 rounded btn-mobile font-bold">LANÇAR PARCELADO</button>
        </div>
        <div id="tabelaPagar" class="bg-white p-3 rounded shadow"></div>
    </div>

    <!-- 7. CONTAS A RECEBER -->
    <div id="aba-receber" class="hidden">
        <div class="bg-white p-3 rounded shadow mb-3">
            <h2 class="font-bold mb-2">+ Conta a Receber</h2>
            <input id="descReceb" placeholder="Descrição" class="w-full p-2 border rounded mb-2">
            <input id="valorReceb" type="number" placeholder="Valor Total" class="w-full p-2 border rounded mb-2">
            <input id="parcelasReceb" type="number" placeholder="Qtd Parcelas" value="1" class="w-full p-2 border rounded mb-2">
            <input id="vencReceb" type="date" class="w-full p-2 border rounded mb-2">
            <select id="cliReceb" class="w-full p-2 border rounded mb-2"></select>
            <button onclick="salvarReceb()" class="w-full bg-green-600 text-white p-3 rounded btn-mobile font-bold">LANÇAR PARCELADO</button>
        </div>
        <div id="tabelaReceb" class="bg-white p-3 rounded shadow"></div>
    </div>

    <!-- 8. RELATÓRIOS -->
    <div id="aba-relatorio" class="hidden">
        <div class="bg-white p-3 rounded shadow">
            <h2 class="font-bold mb-2">Relatório Detalhado</h2>
            <input id="dataIni" type="date" class="w-full p-2 border rounded mb-2">
            <input id="dataFim" type="date" class="w-full p-2 border rounded mb-2">
            <button onclick="gerarRel()" class="w-full bg-blue-600 text-white p-3 rounded btn-mobile font-bold">GERAR</button>
            <div id="resumoRel" class="mt-4"></div>
        </div>
    </div>

    <!-- 9. FECHAMENTO CAIXA -->
    <div id="aba-caixa" class="hidden">
        <div class="bg-white p-3 rounded shadow mb-3">
            <h2 class="font-bold mb-2">Movimentação Caixa</h2>
            <button onclick="mostrarEntrada()" class="w-full bg-green-500 text-white p-3 rounded mb-2">ENTRADA AVULSA</button>
            <button onclick="mostrarSangria()" class="w-full bg-red-500 text-white p-3 rounded mb-2">SANGRIA</button>
            <div id="formMov" class="hidden">
                <input id="descMov" placeholder="Descrição" class="w-full p-2 border rounded mb-2">
                <input id="valorMov" type="number" placeholder="Valor" class="w-full p-2 border rounded mb-2">
                <button onclick="salvarMov()" class="w-full bg-purple-600 text-white p-3 rounded">SALVAR</button>
            </div>
        </div>
        <div class="bg-white p-3 rounded shadow">
            <h2 class="font-bold mb-2">Fechamento do Caixa</h2>
            <p class="text-3xl font-bold text-center text-green-600">R$ <span id="saldoCaixa">0.00</span></p>
            <button onclick="fecharCaixa()" class="w-full bg-purple-600 text-white p-3 rounded mt-4 btn-mobile font-bold">GERAR FECHAMENTO</button>
            <div id="detalheCaixa" class="mt-4"></div>
        </div>
    </div>
</main>

<nav class="fixed bottom-0 left-0 right-0 bg-white shadow-2xl grid grid-cols-5 border-t text-center">
    <button onclick="aba('venda')" id="btn-venda" class="py-3 text-xs aba-ativa">VENDAS</button>
    <button onclick="aba('produtos')" id="btn-produtos" class="py-3 text-xs">PROD</button>
    <button onclick="aba('clientes')" id="btn-clientes" class="py-3 text-xs">CLI</button>
    <button onclick="aba('fornecedores')" id="btn-fornecedores" class="py-3 text-xs">FOR</button>
    <button onclick="aba('loja')" id="btn-loja" class="py-3 text-xs">LOJA</button>
    <button onclick="aba('pagar')" id="btn-pagar" class="py-3 text-xs">PAGAR</button>
    <button onclick="aba('receber')" id="btn-receber" class="py-3 text-xs">RECEB</button>
    <button onclick="aba('relatorio')" id="btn-relatorio" class="py-3 text-xs">REL</button>
    <button onclick="aba('caixa')" id="btn-caixa" class="py-3 text-xs">CAIXA</button>
</nav>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, setDoc, getDoc, Timestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const firebaseConfig = {apiKey: "AIzaSyBaR2gOjcWkQ625WuVPFFcZndrsKk3MqGY",authDomain: "web-pdv-6546d.firebaseapp.com",projectId: "web-pdv-6546d",storageBucket: "web-pdv-6546d.appspot.com",messagingSenderId: "985739667688",appId: "1:985739667688:web:742dab33141e39fd97815d"};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let carrinho = [], produtos = [], clientes = [], fornecedores = [], vendas = [], movimentacoes = [], lojaData = {};
let desconto = 0; let tipoMov = ''; const SENHA_ZERAR = "1234";
const $ = id => document.getElementById(id);
window.aba = id => { document.querySelectorAll('main > div').forEach(d=>d.classList.add('hidden')); $(`aba-${id}`).classList.remove('hidden'); document.querySelectorAll('nav button').forEach(b=>b.classList.remove('aba-ativa')); $(`btn-${id}`).classList.add('aba-ativa') }

window.entrar = () => { const e=$('email').value, s=$('senha').value; signInWithEmailAndPassword(auth,e,s).catch(err=>$('msg').innerText=err.message) }
window.cadastrar = () => { const e=$('email').value, s=$('senha').value; createUserWithEmailAndPassword(auth,e,s).catch(err=>$('msg').innerText=err.message) }
window.sair = () => signOut(auth);
onAuthStateChanged(auth, u => { if(u){$('login').classList.add('hidden');$('app').classList.remove('hidden');carregarTudo()}else{$('login').classList.remove('hidden');$('app').classList.add('hidden')} });

async function carregarTudo(){
    produtos = (await getDocs(collection(db,"produtos"))).docs.map(d=>({id:d.id,...d.data()}));
    clientes = (await getDocs(collection(db,"clientes"))).docs.map(d=>({id:d.id,...d.data()}));
    fornecedores = (await getDocs(collection(db,"fornecedores"))).docs.map(d=>({id:d.id,...d.data()}));
    vendas = (await getDocs(collection(db,"vendas"))).docs.map(d=>({id:d.id,...d.data()}));
    movimentacoes = (await getDocs(collection(db,"movimentacoes"))).docs.map(d=>({id:d.id,...d.data()}));
    const lojaSnap = await getDoc(doc(db,"loja","dados"));
    if(lojaSnap.exists()){lojaData=lojaSnap.data(); $('nomeLoja').value=lojaData.nome;$('cnpjLoja').value=lojaData.cnpj;$('telLoja').value=lojaData.tel;$('endLoja').value=lojaData.end}

    // ALERTA CONTAS A VENCER EM 3 DIAS
    let hoje = new Date(); let em3Dias = new Date(); em3Dias.setDate(hoje.getDate() + 3);
    let pagarSnap = await getDocs(collection(db,"contasPagar"));
    let contasVencer = pagarSnap.docs.filter(d=>{
        let dta = new Date(d.data().venc);
        return d.data().status=="Pendente" && dta >= hoje && dta <= em3Dias
    });
    if(contasVencer.length > 0){
        $('alertaContas').innerHTML = `🚨 ATENÇÃO: ${contasVencer.length} conta(s) a pagar nos próximos 3 dias!`;
        $('alertaContas').classList.remove('hidden');
    } else { $('alertaContas').classList.add('hidden'); }

    listarProd(); listarCli(); listarFor(); listarPagar(); listarReceb(); carregarSelects(); caixaSaldo();
}

// COPIA O RESTO DAS FUNCOES: buscar, addCarrinho, vender, CRUDS, salvarPagar, salvarReceb, listarPagar, listarReceb, pagarConta, receberConta, gerarRel, caixa, zerarSistema

function listarProd(){
    $('tabelaProd').innerHTML = produtos.map(p=>{
        let classe = p.estoque <= (p.estMin||0)? 'bg-red-200 border-2 border-red-500' : 'bg-white';
        return `<div class="flex justify-between border-b py-2 p-2 rounded ${classe}">
            <span><b>${p.nome}</b><br><small>Est:${p.estoque} | Min:${p.estMin||0}</small></span>
            <button onclick="editarProd('${p.id}')" class="bg-yellow-500 text-white px-2 py-1 rounded text-xs">E</button>
        </div>`
    }).join('')
}
window.salvarProd = async () => { const data={cod:$('cod').value,nome:$('nome').value,custo:+$('custo').value,preco:+$('preco').value,estoque:+$('estoque').value,estMin:+$('estMin').value}; if($('idProd').value){await updateDoc(doc(db,"produtos",$('idProd').value),data)}else{await addDoc(collection(db,"produtos"),data)} alert("Salvo!"); limparProd(); carregarTudo() }
window.editarProd = id => {const p=produtos.find(x=>x.id==id); $('idProd').value=p.id;$('cod').value=p.cod;$('nome').value=p.nome;$('custo').value=p.custo;$('preco').value=p.preco;$('estoque').value=p.estoque;$('estMin').value=p.estMin;$('btnProd').innerText='ATUALIZAR'}
function limparProd(){$('idProd').value='';$('cod').value='';$('nome').value='';$('custo').value='';$('preco').value='';$('estoque').value='';$('estMin').value='';$('btnProd').innerText='SALVAR'}

// COPIA AQUI AS OUTRAS FUNCOES QUE JA TEM: salvarCli, listarCli, salvarFor, listarFor, salvarLoja, salvarPagar, salvarReceb, listarPagar, listarReceb, pagarConta, receberConta, vender, imprimirCupom, reimprimirUltima, exportarExcel, etc

window.reimprimirUltima = async () => {
    if(vendas.length == 0) return alert("Nenhuma venda feita ainda");
    let ultima = vendas.sort((a,b)=>b.data.toDate() - a.data.toDate())[0];
    imprimirCupom(ultima.id);
}

window.exportarExcel = async () => {
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(produtos), "Produtos");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(clientes), "Clientes");
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(vendas), "Vendas");
    XLSX.writeFile(wb, `Backup_PDV_${new Date().toLocaleDateString()}.xlsx`);
    alert("Backup baixado!")
}
</script>
</body>
</html>
