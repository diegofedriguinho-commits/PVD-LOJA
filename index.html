<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>D2 MINIMERCADO PDV V18.23</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#f1f5f9;font-family:'Segoe UI',sans-serif;padding-bottom:90px}
.btn{padding:10px 14px;border-radius:8px;font-weight:bold;cursor:pointer}
.input{padding:10px;border:1px solid #ccc;border-radius:8px;width:100%}
.card{background:white;padding:16px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.aba{display:none}.ativa{display:block}
.menu{display:grid;grid-template-columns:repeat(auto-fit, minmax(70px, 1fr));position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;z-index:10}
.menu button{padding:10px 4px;font-size:10px;font-weight:bold;white-space:nowrap}
.menu button.on{background:#2563eb;color:white}
.hidden{display:none}
</style>
</head>
<body>

<div id="telaLogin" class="fixed inset-0 bg-black bg-opacity-80 flex items-center justify-center z-50">
  <div class="card w-80 text-center">
    <h2 class="text-2xl font-bold mb-2">D2 MINIMERCADO</h2>
    <p class="mb-3">Faça Login</p>
    <select id="usuarioLogin" class="input mb-2">
      <option value="">Selecione o Usuário</option>
      <option value="caixa">CAIXA - 1234</option>
      <option value="gerente">GERENTE - 9999</option>
    </select>
    <input id="senhaLogin" type="password" class="input mb-2" placeholder="Digite a Senha">
    <button onclick="logar()" class="w-full btn bg-blue-600 text-white">ENTRAR</button>
    <p id="erroLogin" class="text-red-500 text-sm mt-2"></p>
  </div>
</div>

<div class="p-2 pb-24">
<div id="venda" class="aba ativa"><div class="card"><h2>VENDA FUNCIONANDO</h2><p>Se apareceu isso o login deu certo!</p></div></div>
<div id="produtos" class="aba"><div class="card"><h2>PRODUTOS</h2></div></div>
<div id="caixa" class="aba"><div class="card"><h2>CAIXA</h2></div></div>
</div>

<nav class="menu">
  <button onclick="mostrarAba('venda')" id="btn-venda" class="on">VENDAS</button>
  <button onclick="mostrarAba('produtos')" id="btn-produtos">PRODUTOS</button>
  <button onclick="mostrarAba('caixa')" id="btn-caixa">CAIXA</button>
  <button onclick="sair()">SAIR</button>
</nav>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const firebaseConfig = {apiKey: "AIzaSyBaR2gOjcWkQ625WuVPFFcZndrsKk3MqGY",authDomain: "web-pdv-6546d.firebaseapp.com",projectId: "web-pdv-6546d"};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $=id=>document.getElementById(id);

let usuarioLogado=null;
let permissoes = {caixa: {senha: '1234'}, gerente: {senha: '9999'}}

// AS FUNCOES TEM QUE ESTAR NO WINDOW PRA BOTAO ACHAR
window.mostrarAba=id=>{
  document.querySelectorAll('.aba').forEach(a=>a.classList.remove('ativa'));
  $(id).classList.add('ativa');
  document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('on'));
  $(`btn-${id}`).classList.add('on');
}

window.logar=()=>{
  let user = $('usuarioLogin').value;
  let senha = $('senhaLogin').value;
  if(permissoes[user] && permissoes[user].senha == senha){
    usuarioLogado = user;
    $('telaLogin').classList.add('hidden');
    alert('Logado como: ' + user.toUpperCase());
  } else {
    $('erroLogin').innerText = 'Usuário ou Senha inválidos!';
  }
}

window.sair=()=>{
  usuarioLogado = null;
  $('telaLogin').classList.remove('hidden');
  $('senhaLogin').value='';
}
</script>
</body>
</html>
