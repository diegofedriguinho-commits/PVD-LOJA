<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDV Loja</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
  body{background:#f0f2f5}
  .login{display:flex;justify-content:center;align-items:center;height:100vh}
  .login-box{background:#fff;padding:30px;border-radius:8px;box-shadow:0 2px 10px #0001;width:350px}
  .login-box h2{text-align:center;margin-bottom:20px}
  input,button{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:5px;font-size:16px}
  button{background:#28a745;color:#fff;border:none;cursor:pointer;font-weight:bold}
  button:hover{opacity:0.9}
  .header{background:#343a40;color:#fff;padding:15px;display:flex;justify-content:space-between}
  .menu{display:flex;gap:10px;background:#fff;padding:10px;box-shadow:0 2px 5px #0001}
  .menu button{background:#007bff}
  .container{padding:20px}
  .card{background:#fff;padding:20px;border-radius:8px;margin-bottom:15px}
  table{width:100%;border-collapse:collapse;margin-top:10px}
  th,td{border:1px solid #ddd;padding:10px;text-align:left}
  th{background:#f8f9fa}
  .carrinho-item{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid #eee}
  .total{font-size:24px;font-weight:bold;text-align:right;margin-top:10px}
  .hidden{display:none}
</style>
</head>
<body>

<div id="telaLogin" class="login">
  <div class="login-box">
    <h2>PDV Loja</h2>
    <input id="email" type="email" placeholder="Email" value="admin@teste.com">
    <input id="senha" type="password" placeholder="Senha" value="123456">
    <button onclick="logar()">Entrar</button>
  </div>
</div>

<div id="telaPDV" class="hidden">
  <div class="header">
    <h3>PDV LOJA</h3>
    <span id="usuario"></span>
  </div>
  <div class="menu">
    <button onclick="mostrar('dashboard')">Dashboard</button>
    <button onclick="mostrar('produtos')">Produtos</button>
    <button onclick="mostrar('vendas')">Vendas</button>
    <button onclick="sair()" style="background:#dc3545">Sair</button>
  </div>
  <div class="container">

    <div id="dashboard" class="card">
      <h3>Dashboard</h3>
      <p>Vendas Hoje: <b id="totalVendas">R$ 0,00</b></p>
      <p>Total de Produtos: <b id="totalProdutos">0</b></p>
    </div>

    <div id="produtos" class="card hidden">
      <h3>Cadastro de Produtos</h3>
      <input id="nomeProd" placeholder="Nome do Produto">
      <input id="precoProd" type="number" step="0.01" placeholder="Preço R$">
      <input id="estoqueProd" type="number" placeholder="Estoque">
      <button onclick="addProduto()">+ Adicionar Produto</button>
      <table><thead><tr><th>Nome</th><th>Preço</th><th>Estoque</th><th>Ação</th></tr></thead><tbody id="listaProdutos"></tbody></table>
    </div>

    <div id="vendas" class="card hidden">
      <h3>Tela de Vendas</h3>
      <select id="selectProd" onchange="addCarrinho()"><option>Selecione um produto</option></select>
      <div id="carrinho"></div>
      <div class="total">Total: R$ <span id="totalCarrinho">0.00</span></div>
      <button onclick="finalizarVenda()" style="background:#28a745">Finalizar Venda</button>
    </div>

  </div>
</div>

<script>
let produtos = JSON.parse(localStorage.getItem('produtos')) || [];
let vendas = JSON.parse(localStorage.getItem('vendas')) || [];
let carrinho = [];

function logar(){
  if(email.value=='admin@teste.com' && senha.value=='123456'){
    document.getElementById('telaLogin').classList.add('hidden');
    document.getElementById('telaPDV').classList.remove('hidden');
    document.getElementById('usuario').innerText = 'Admin';
    carregarProdutos();
    atualizarDashboard();
  } else { alert('Login inválido') }
}

function sair(){
  document.getElementById('telaPDV').classList.add('hidden');
  document.getElementById('telaLogin').classList.remove('hidden');
}

function mostrar(id){
  document.querySelectorAll('.container .card').forEach(c=>c.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
}

function addProduto(){
  let p = {id:Date.now(), nome:nomeProd.value, preco:parseFloat(precoProd.value), estoque:parseInt(estoqueProd.value)};
  produtos.push(p);
  localStorage.setItem('produtos',JSON.stringify(produtos));
  nomeProd.value=precoProd.value=estoqueProd.value='';
  carregarProdutos();
}

function carregarProdutos(){
  listaProdutos.innerHTML='';
  selectProd.innerHTML='<option>Selecione um produto</option>';
  produtos.forEach(p=>{
    listaProdutos.innerHTML += `<tr><td>${p.nome}</td><td>R$ ${p.preco.toFixed(2)}</td><td>${p.estoque}</td><td><button onclick="delProd(${p.id})" style="background:#dc3545;padding:5px">Excluir</button></td></tr>`;
    selectProd.innerHTML += `<option value="${p.id}">${p.nome} - R$ ${p.preco.toFixed(2)}</option>`;
  });
  document.getElementById('totalProdutos').innerText = produtos.length;
}

function delProd(id){
  produtos = produtos.filter(p=>p.id!=id);
  localStorage.setItem('produtos',JSON.stringify(produtos));
  carregarProdutos();
}

function addCarrinho(){
  let id = selectProd.value;
  let prod = produtos.find(p=>p.id==id);
  if(prod && prod.estoque>0){
    carrinho.push(prod);
    renderCarrinho();
  }
}

function renderCarrinho(){
  carrinhoDiv = document.getElementById('carrinho');
  carrinhoDiv.innerHTML='';
  let total=0;
  carrinho.forEach((p,i)=>{
    total+=p.preco;
    carrinhoDiv.innerHTML += `<div class="carrinho-item">${p.nome} - R$ ${p.preco.toFixed(2)} <button onclick="carrinho.splice(${i},1);renderCarrinho()" style="background:#dc3545;padding:3px 8px">x</button></div>`;
  });
  document.getElementById('totalCarrinho').innerText = total.toFixed(2);
}

function finalizarVenda(){
  if(carrinho.length==0) return alert('Carrinho vazio');
  vendas.push({data:new Date(), itens:carrinho, total: carrinho.reduce((a,b)=>a+b.preco,0)});
  localStorage.setItem('vendas',JSON.stringify(vendas));
  carrinho=[];
  renderCarrinho();
  alert('Venda finalizada!');
  atualizarDashboard();
}

function atualizarDashboard(){
  let total = vendas.reduce((a,b)=>a+b.total,0);
  document.getElementById('totalVendas').innerText = 'R$ '+total.toFixed(2);
}
</script>
</body>
</html>
